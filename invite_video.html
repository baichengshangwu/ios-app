function getLang() {
  try { if (typeof window.parent !== 'undefined' && window.parent.curLang) return window.parent.curLang; } catch(e) {}
  var nav = navigator.language || 'zh-CN';
  if (nav.startsWith('zh')) return nav.includes('TW')||nav.includes('HK')?'zh-TW':'zh-CN';
  if (nav.startsWith('en')) return 'en';
  return 'zh-CN';
}

// ── Easing ──
function easeOutBounce(t) { const n=7.5625,d=2.75; if(t<1/d)return n*t*t; if(t<2/d)return n*(t-=1.5/d)*t+.75; if(t<2.5/d)return n*(t-=2.25/d)*t+.9375; return n*(t-=2.625/d)*t+.984375; }
function easeOutElastic(t) { if(t===0||t===1)return t; return Math.pow(2,-10*t)*Math.sin((t-1)*(2*Math.PI)/.3)+1; }
function easeInOutCubic(t) { return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
function lerp(a,b,t) { return a+(b-a)*t; }

// ── Character: Cartoon Person ──
function drawCartoonPerson(x, y, skin, shirt, pants, scale, anim) {
  scale = scale || 1;
  anim = anim || {};
  var s = scale;
  var bob = anim.bob || 0;
  var armWave = anim.armWave || 0;
  var expression = anim.expression || 'happy';
  var leanX = anim.leanX || 0;
  var leanY = anim.leanY || 0;
  
  var cx = x + leanX;
  var cy = y + bob + leanY;
  
  ctx.save();
  ctx.translate(cx, cy);
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath();
  ctx.ellipse(0, 65*s, 28*s, 6*s, 0, 0, Math.PI*2);
  ctx.fill();
  
  // Legs
  var legSpread = anim.legSpread || 0;
  ctx.fillStyle = pants;
  ctx.beginPath(); ctx.roundRect(-10*s + legSpread*5*s, 38*s, 10*s, 28*s, 5*s); ctx.fill();
  ctx.beginPath(); ctx.roundRect(0*s - legSpread*5*s, 38*s, 10*s, 28*s, 5*s); ctx.fill();
  
  // Shoes
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.ellipse(-5*s + legSpread*5*s, 68*s, 7*s, 4*s, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5*s - legSpread*5*s, 68*s, 7*s, 4*s, 0, 0, Math.PI*2); ctx.fill();
  
  // Body
  var bodyGrad = ctx.createLinearGradient(0, 12*s, 0, 42*s);
  bodyGrad.addColorStop(0, shirt);
  bodyGrad.addColorStop(1, darken(shirt, .15));
  ctx.fillStyle = bodyGrad;
  ctx.beginPath(); ctx.roundRect(-18*s, 12*s, 36*s, 30*s, 10*s); ctx.fill();
  
  // Arms
  ctx.fillStyle = shirt;
  ctx.save();
  ctx.translate(-20*s, 16*s);
  ctx.rotate(-0.3 + armWave * 0.8);
  ctx.beginPath(); ctx.roundRect(-5*s, 0, 10*s, 30*s, 5*s); ctx.fill();
  // Hand
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, 32*s, 7*s, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  
  ctx.save();
  ctx.translate(20*s, 16*s);
  ctx.rotate(0.3 - armWave * 0.8);
  ctx.beginPath(); ctx.roundRect(-5*s, 0, 10*s, 30*s, 5*s); ctx.fill();
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, 32*s, 7*s, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  
  // Head
  var headGrad = ctx.createRadialGradient(-3*s, -3*s, 2*s, 0, 0, 18*s);
  headGrad.addColorStop(0, lighten(skin, .15));
  headGrad.addColorStop(1, skin);
  ctx.fillStyle = headGrad;
  ctx.beginPath(); ctx.arc(0, -4*s, 18*s, 0, Math.PI*2); ctx.fill();
  
  // Hair
  ctx.fillStyle = '#2c1810';
  ctx.beginPath(); ctx.arc(0, -8*s, 19*s, Math.PI, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-10*s, -12*s, 6*s, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(10*s, -12*s, 6*s, 0, Math.PI*2); ctx.fill();
  
  // Eyes
  if (expression === 'happy') {
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(-7*s, -5*s, 3*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7*s, -5*s, 3*s, 0, Math.PI*2); ctx.fill();
    // Eye shine
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-6*s, -6*s, 1.2*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8*s, -6*s, 1.2*s, 0, Math.PI*2); ctx.fill();
    // Smile
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2*s;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, 7*s, 0.1, Math.PI-0.1); ctx.stroke();
    // Rosy cheeks
    ctx.fillStyle = 'rgba(255,150,150,.4)';
    ctx.beginPath(); ctx.arc(-11*s, 1*s, 4*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(11*s, 1*s, 4*s, 0, Math.PI*2); ctx.fill();
  } else if (expression === 'surprised') {
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(-7*s, -5*s, 4.5*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7*s, -5*s, 4.5*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-6*s, -6*s, 1.5*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8*s, -6*s, 1.5*s, 0, Math.PI*2); ctx.fill();
    // O mouth
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(0, 4*s, 5*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#c44';
    ctx.beginPath(); ctx.arc(0, 4*s, 3*s, 0, Math.PI*2); ctx.fill();
  } else if (expression === 'excited') {
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(-7*s, -5*s, 3*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7*s, -5*s, 3*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-6*s, -6*s, 1.2*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8*s, -6*s, 1.2*s, 0, Math.PI*2); ctx.fill();
    // Big grin with teeth
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 1*s, 9*s, 0.1, Math.PI-0.1); ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2*s;
    ctx.beginPath(); ctx.arc(0, 1*s, 9*s, 0.1, Math.PI-0.1); ctx.stroke();
    ctx.fillStyle = 'rgba(255,150,150,.5)';
    ctx.beginPath(); ctx.arc(-11*s, 1*s, 4*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(11*s, 1*s, 4*s, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(-7*s, -5*s, 2.8*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7*s, -5*s, 2.8*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-6*s, -6*s, 1*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8*s, -6*s, 1*s, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5*s;
    ctx.beginPath(); ctx.arc(0, 2*s, 3*s, 0, Math.PI); ctx.stroke();
  }
  
  ctx.restore();
}

function lighten(hex, amt) {
  var num = parseInt(hex.replace('#',''), 16);
  var r = Math.min(255,(num>>16)+amt*255);
  var g = Math.min(255,((num>>8)&0xFF)+amt*255);
  var b = Math.min(255,(num&0xFF)+amt*255);
  return '#'+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);
}
function darken(hex, amt) {
  var num = parseInt(hex.replace('#',''), 16);
  var r = Math.max(0,(num>>16)-amt*255);
  var g = Math.max(0,((num>>8)&0xFF)-amt*255);
  var b = Math.max(0,(num&0xFF)-amt*255);
  return '#'+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);
}

// ── Particles ──
let particles = [];
let sparkles = [];

function emitSparkles(x, y, count) {
  for (let i = 0; i < count; i++) {
    sparkles.push({
      x, y,
      vx: (Math.random()-.5)*4,
      vy: (Math.random()-.5)*4 - 2,
      life: 30 + Math.random()*30,
      maxLife: 60,
      size: 1.5 + Math.random()*3,
      color: ['#ffd700','#ff6b6b','#06b6d4','#10b981','#a78bfa'][Math.floor(Math.random()*5)]
    });
  }
}

function emitCoin(x, y, targetX, targetY, delay) {
  particles.push({
    type: 'coin',
    x, y, targetX, targetY,
    startX: x, startY: y,
    progress: 0,
    delay: delay || 0,
    duration: 0.6 + Math.random()*0.4,
    rot: Math.random()*Math.PI*2,
    rotV: (Math.random()-.5)*0.3,
    size: 6 + Math.random()*4,
    landed: false,
    landY: targetY || (H-60+Math.random()*20)
  });
}

function emitBill(x, y, targetX, targetY) {
  particles.push({
    type: 'bill',
    x, y, targetX, targetY,
    startX: x, startY: y,
    progress: 0,
    delay: Math.random()*0.3,
    duration: 0.8 + Math.random()*0.5,
    rot: Math.random()*Math.PI,
    rotV: (Math.random()-.5)*0.15,
    wobble: Math.random()*Math.PI*2,
    size: 12 + Math.random()*6,
    color: ['#4CAF50','#66BB6A','#43A047','#81C784'][Math.floor(Math.random()*4)]
  });
}

// ── Coin pile data ──
let pile1 = 0;  // player 1 coin count
let pile2 = 0;  // player 2 coin count
let tableCoins = 0;
let billStack = 0;

// ── Scene state ──
let lastScene = -1;
let sceneStartTime = 0;
let accumulatedCoins = 0;
let sceneInitDone = {};

function getScene(t) {
  if (t < 27) return 0;
  if (t < 46) return 1;
  if (t < 70) return 2;
  if (t < 95) return 3;
  if (t < 120) return 4;
  return 5;
}

function initScene(s) {
  if (sceneInitDone[s]) return;
  sceneInitDone[s] = true;
  particles = [];
  sparkles = [];
  pile1 = 0; pile2 = 0;
  tableCoins = 0; billStack = 0;
}

// ── Drawing helpers ──
function drawPile(x, y, count, maxShow) {
  maxShow = maxShow || 30;
  var show = Math.min(count, maxShow);
  for (var i = 0; i < show; i++) {
    var px = x + Math.sin(i*1.7+i*0.3)*18;
    var py = y - i*5 + Math.cos(i*2.1)*6;
    var r = 7 - i*0.08;
    drawGoldCoin(px, py, Math.max(r, 3));
  }
  if (count > 0) {
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(255,215,0,.5)';
    ctx.shadowBlur = 6;
    ctx.fillText('×'+count, x, y - show*5 - 20);
    ctx.shadowBlur = 0;
  }
}

function drawGoldCoin(x, y, r) {
  var grad = ctx.createRadialGradient(x-1, y-1, r*.15, x, y, r);
  grad.addColorStop(0, '#fff7cc');
  grad.addColorStop(.3, '#ffd700');
  grad.addColorStop(.7, '#f0a500');
  grad.addColorStop(1, '#b8860b');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#8b6914'; ctx.lineWidth = .8; ctx.stroke();
  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.arc(x-r*.2, y-r*.2, r*.3, 0, Math.PI*2); ctx.fill();
  // $ sign
  ctx.fillStyle = 'rgba(139,105,20,.5)';
  ctx.font = `${r*1.2}px serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('$', x, y);
}

function drawFlyingBill(x, y, w, h, rot, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  var grad = ctx.createLinearGradient(-w/2, -h/2, w/2, h/2);
  grad.addColorStop(0, color);
  grad.addColorStop(1, darken(color, .2));
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.roundRect(-w/2, -h/2, w, h, 3); ctx.fill();
  ctx.fillStyle = lighten(color, .3);
  ctx.beginPath(); ctx.roundRect(-w/2+2, -h/2+2, w-4, h-4, 2); ctx.fill();
  ctx.fillStyle = darken(color, .3);
  ctx.font = `bold ${Math.min(w,h)*.55}px serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('$', 0, 1);
  ctx.restore();
}

function drawTable(x, y, w, h) {
  var grad = ctx.createLinearGradient(x, y, x, y+h);
  grad.addColorStop(0, '#6D4C41');
  grad.addColorStop(1, '#4E342E');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 6); ctx.fill();
  ctx.fillStyle = '#8D6E63';
  ctx.fillRect(x, y, w, 4);
  ctx.fillStyle = '#3E2723';
  ctx.fillRect(x+10, y+h, 10, 35);
  ctx.fillRect(x+w-20, y+h, 10, 35);
}

function drawMonitor(x, y, w, h, lines) {
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.fill();
  ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.stroke();
  // Screen content
  ctx.fillStyle = '#06b6d4';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(getLang().startsWith('zh')?'P2P 自由市场':'P2P Market', x+w/2, y+22);
  ctx.fillStyle = '#fff';
  ctx.font = '11px monospace';
  ctx.textAlign = 'left';
  if (lines) lines.forEach(function(l, i) {
    ctx.fillStyle = l.done ? '#10b981' : '#ccc';
    ctx.fillText(l.text, x+12, y+42+i*16);
  });
  // Stand
  ctx.fillStyle = '#333';
  ctx.fillRect(x+w/2-3, y+h, 6, 15);
  ctx.fillRect(x+w/2-20, y+h+15, 40, 4);
}

// ── Background ──
function drawBg(scene, t) {
  var colors;
  switch(scene) {
    case 0: colors = ['#1a0a2e','#16213e','#0a0a1a']; break;
    case 1: colors = ['#0f2027','#203a43','#0a0a1a']; break;
    case 2: colors = ['#1a1a2e','#16213e','#0a1a2e']; break;
    case 3: colors = ['#2e1a0a','#1a0a2e','#0a0a1a']; break;
    case 4: colors = ['#1a0a2e','#2e1a2e','#0a0a1a']; break;
    default: colors = ['#0a1a2e','#1a2e0a','#0a0a1a'];
  }
  var grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, colors[0]);
  grad.addColorStop(.5, colors[1]);
  grad.addColorStop(1, colors[2]);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  
  // Ambient particles
  for (var i = 0; i < 15; i++) {
    var sx = (i*197+Math.sin(t*.5+i)*50) % W;
    var sy = (i*163+Math.cos(t*.7+i)*30) % (H*.5);
    ctx.fillStyle = 'rgba(255,255,255,'+(.15+Math.sin(t*2+i)*.1)+')';
    ctx.beginPath(); ctx.arc(sx, sy, 1+Math.sin(t+i)*.5, 0, Math.PI*2); ctx.fill();
  }
}

// ── Update ──
let lastSubtitleIdx = -1;
let spokenSubtitles = {};

function update(dt) {
  // Update sparkles
  for (var i = sparkles.length-1; i >= 0; i--) {
    var s = sparkles[i];
    s.x += s.vx; s.y += s.vy; s.life--;
    if (s.life <= 0) sparkles.splice(i,1);
  }
  
  // Update particles
  for (var i = particles.length-1; i >= 0; i--) {
    var p = particles[i];
    if (p.delay > 0) { p.delay -= dt; continue; }
    p.progress += dt / p.duration;
    if (p.progress >= 1) {
      p.progress = 1;
      if (!p.landed && p.type === 'coin') {
        p.landed = true;
        if (p.targetX < W/2) pile1++; else pile2++;
      }
      if (!p.landed && p.type === 'bill') {
        p.landed = true; billStack++;
      }
      if (p.progress > 1.5) particles.splice(i,1);
      continue;
    }
    var t = easeOutBounce(Math.min(p.progress, 1));
    p.x = lerp(p.startX, p.targetX, t);
    p.y = lerp(p.startY, p.landY || p.targetY, t) - (1-t)*80;
    p.rot += p.rotV;
    if (p.type === 'bill') p.wobble += 0.1;
  }
}

// ── Scene rendering ──
function renderScene(scene, t) {
  var st = t - (scene===0?0:scene===1?27:scene===2?46:scene===3?70:scene===4?95:120);
  initScene(scene);
  
  switch(scene) {
    case 0: // Friendly exchange
      var bob1 = Math.sin(t*3)*3;
      var bob2 = Math.sin(t*3+1)*3;
      var happy = st > 4 && st < 25;
      var expr1 = st > 14 ? 'excited' : 'happy';
      var expr2 = st > 14 ? 'excited' : 'happy';
      
      drawCartoonPerson(180, 280, '#ffcc99', '#6366f1', '#2c3e50', 1.15, {bob: bob1, expression: expr1, armWave: Math.sin(t*5)*.3});
      drawCartoonPerson(600, 280, '#ffcc99', '#8b5cf6', '#2c3e50', 1.15, {bob: bob2, expression: expr2, armWave: Math.sin(t*5+1)*.3});
      
      // Labels
      ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(getLang().startsWith('zh')?'你':'YOU', 180, 370);
      ctx.fillText(getLang().startsWith('zh')?'朋友':'FRIEND', 600, 370);
      
      // Exchange arrows
      if (st > 2 && st < 16) {
        ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3; ctx.setLineDash([10,5]);
        ctx.beginPath(); ctx.moveTo(230, 230); ctx.lineTo(550, 230); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#ffd700'; ctx.font = 'bold 16px sans-serif';
        ctx.fillText('💛 1000 AC', 390, 220);
      }
      if (st > 8 && st < 20) {
        ctx.strokeStyle = '#4CAF50'; ctx.lineWidth = 3; ctx.setLineDash([10,5]);
        ctx.beginPath(); ctx.moveTo(550, 270); ctx.lineTo(230, 270); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#4CAF50'; ctx.font = 'bold 16px sans-serif';
        ctx.fillText('💵 $$$', 390, 265);
      }
      
      // Coin rain
      if (st > 2 && st < 18 && Math.random() < .4) {
        emitCoin(Math.random()*W, -20, Math.random()<.5?200:600, H-80+Math.random()*30, 0);
      }
      // Bill rain
      if (st > 8 && st < 22 && Math.random() < .25) {
        emitBill(400+Math.random()*200, -30, 400+Math.random()*200, H-80);
      }
      if (happy && Math.random() < .15) emitSparkles(Math.random()<.5?180:600, 240+Math.random()*40, 3);
      break;
      
    case 1: // Invite rewards
      drawCartoonPerson(200, 260, '#ffcc99', '#10b981', '#1a3a2a', 1.2, {bob: Math.sin(t*3)*2, expression: 'excited', armWave: Math.sin(t*4)*.4});
      
      ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(getLang().startsWith('zh')?'你':'YOU', 200, 350);
      
      drawPile(200, 370, pile1 || Math.floor(st*1.2), 30);
      if (pile1 > 15) drawPile(240, 370, Math.floor((pile1||st*1.2)*.6), 25);
      if (pile1 > 25) drawPile(160, 370, Math.floor((pile1||st*1.2)*.3), 20);
      
      // +5 floating
      if (st > 1 && st < 20 && Math.floor(st*2)%3 === 0) {
        ctx.fillStyle = '#ffd700'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
        ctx.globalAlpha = .7 + Math.sin(t*8)*.3;
        ctx.fillText('+5', 200 + Math.sin(t*3)*20, 180 - (st%3)*30);
        ctx.globalAlpha = 1;
      }
      
      if (st > 2 && st < 20 && Math.random() < .3) {
        emitCoin(Math.random()*200+100, -20, 200, H-80, 0);
      }
      if (st > 5 && Math.random() < .2) emitSparkles(200, 200+Math.random()*50, 2);
      break;
      
    case 2: // Platform trading
      drawMonitor(60, 50, 240, 200, [
        {text: 'Order #001  0.12 CNY  ✓', done: true},
        {text: 'Order #002  0.11 CNY  ✓', done: st>10},
        {text: 'Order #003  0.10 CNY  ✓', done: st>16},
        {text: 'Order #004  0.09 CNY  ✓', done: st>20},
        {text: 'Order #005  0.08 CNY  ...', done: false}
      ]);
      
      drawCartoonPerson(480, 260, '#ffcc99', '#f59e0b', '#3d2e0a', 1.15, {bob: Math.sin(t*3)*2, expression: st>8?'excited':'happy', armWave: Math.sin(t*5)*.3});
      drawTable(400, 330, 220, 10);
      
      // Bills on table
      for (var j = 0; j < Math.min(Math.floor(st/4), 12); j++) {
        drawFlyingBill(430+j*28, 325, 14, 8, .05*j, ['#4CAF50','#66BB6A','#43A047'][j%3]);
      }
      
      // Flying bills
      if (st > 3 && st < 22 && Math.random() < .25) {
        emitBill(500+Math.random()*100, -20, 500+Math.random()*100, 320);
      }
      if (st > 10 && Math.random() < .2) emitSparkles(480, 200+Math.random()*80, 3);
      break;
      
    case 3: // Staking
      // Billboard
      ctx.fillStyle = '#1a1a2e'; ctx.beginPath(); ctx.roundRect(30, 40, 200, 90, 10); ctx.fill();
      ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(30, 40, 200, 90, 10); ctx.stroke();
      ctx.fillStyle = '#ffd700'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(getLang().startsWith('zh')?'📊 抵押获利':'📊 Staking', 130, 68);
      ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('30天 年化 8%', 45, 88);
      ctx.fillText('180天 年化 12%', 45, 105);
      ctx.fillText('365天 年化 18%', 45, 122);
      
      drawCartoonPerson(400, 230, '#ffcc99', '#ef4444', '#1a1a2e', 1.2, {
        bob: Math.sin(t*2)*2,
        expression: st>4?'excited':(st>1?'surprised':'neutral'),
        armWave: Math.sin(t*3)*.2,
        leanX: st>3?20:0
      });
      drawTable(260, 330, 280, 10);
      
      // Table coins
      var tc = Math.min(Math.floor(st*2), 40);
      for (var k = 0; k < tc; k++) {
        drawGoldCoin(280+(k%10)*25, 325-Math.floor(k/10)*7, 6.5);
      }
      
      // Coin rain
      if (st > 3 && st < 25 && Math.random() < .35) {
        emitCoin(300+Math.random()*200, -20, 300+Math.random()*200, 320, 0);
      }
      if (st > 5 && Math.random() < .2) emitSparkles(400, 180+Math.random()*60, 3);
      
      // Glow on table
      if (tc > 30) {
        ctx.fillStyle = 'rgba(255,215,0,'+(.1+Math.sin(t*3)*.05)+')';
        ctx.beginPath(); ctx.arc(400, 310, 120, 0, Math.PI*2); ctx.fill();
      }
      break;
      
    case 4: // Staking negotiation
      drawCartoonPerson(180, 260, '#ffcc99', '#06b6d4', '#1a1a2e', 1.1, {bob: Math.sin(t*3)*2, expression: 'happy', armWave: Math.sin(t*4)*.3});
      drawCartoonPerson(560, 260, '#ffcc99', '#8b5cf6', '#1a1a2e', 1.1, {bob: Math.sin(t*3+1)*2, expression: 'happy', armWave: Math.sin(t*4+1)*.3});
      
      ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(getLang().startsWith('zh')?'你':'YOU', 180, 340);
      ctx.fillText(getLang().startsWith('zh')?'朋友':'FRIEND', 560, 340);
      
      drawTable(300, 340, 200, 10);
      
      // Bills on table
      for (var j = 0; j < Math.min(Math.floor(st/3), 15); j++) {
        drawFlyingBill(330+j*18, 335, 14, 8, .05*j, ['#4CAF50','#2196F3','#43A047','#FF9800'][j%4]);
      }
      
      // Negotiation bubbles
      if (st > 2 && st < 12) {
        ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.roundRect(220, 180, 100, 30, 10); ctx.fill();
        ctx.fillStyle = '#333'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('0.10?', 270, 200);
      }
      if (st > 5 && st < 15) {
        ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.roundRect(470, 190, 100, 30, 10); ctx.fill();
        ctx.fillStyle = '#333'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('0.09!', 520, 210);
      }
      
      if (st > 8 && Math.random() < .2) emitSparkles(370, 280, 3);
      break;
      
    case 5: // Membership tiers
      var tiers = [
        {name: getLang().startsWith('zh')?'青铜':'Bronze', color: '#CD7F32', x: 25, icon: '🥉'},
        {name: getLang().startsWith('zh')?'白银':'Silver', color: '#C0C0C0', x: 160, icon: '🥈'},
        {name: getLang().startsWith('zh')?'黄金':'Gold', color: '#FFD700', x: 295, icon: '🥇'},
        {name: getLang().startsWith('zh')?'铂金':'Platinum', color: '#E5E4E2', x: 430, icon: '💎'},
        {name: getLang().startsWith('zh')?'钻石':'Diamond', color: '#B9F2FF', x: 565, icon: '👑'}
      ];
      
      tiers.forEach(function(ti, idx) {
        var glow = ti.name === (getLang().startsWith('zh')?'钻石':'Diamond') ? (20+Math.sin(st*3)*5) : 0;
        if (glow > 0) {
          ctx.shadowColor = ti.color;
          ctx.shadowBlur = glow;
        }
        ctx.fillStyle = 'rgba(26,26,46,.95)';
        ctx.beginPath(); ctx.roundRect(ti.x, 100, 100, 260, 12); ctx.fill();
        ctx.strokeStyle = ti.color; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.roundRect(ti.x, 100, 100, 260, 12); ctx.stroke();
        ctx.shadowBlur = 0;
        
        ctx.fillStyle = ti.color; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(ti.name, ti.x+50, 135);
        ctx.font = '28px sans-serif';
        ctx.fillText(ti.icon, ti.x+50, 175);
        ctx.fillStyle = '#000'; ctx.font = 'bold 20px sans-serif';
        ctx.fillText(idx+1, ti.x+50, 180);
        
        ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.font = '10px sans-serif';
        var bnfts = ['↑奖励', '↑利率', '↑限额'];
        bnfts.forEach(function(b, bi) {
          ctx.fillText(b, ti.x+50, 230+bi*28);
        });
      });
      
      ctx.fillStyle = '#ffd700'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(getLang().startsWith('zh')?'累计充值越多，等级越高，权益越丰厚！':'More recharge = higher tier = better perks!', 400, 400);
      ctx.fillText(getLang().startsWith('zh')?'🚀 立即邀请朋友，开启财富之旅！':'🚀 Invite friends now, start your fortune!', 400, 435);
      emitSparkles(400, 420, 8);
      
      // Animate tier cards appearing
      if (st < 1) {
        tiers.forEach(function(ti, idx) {
          var p = Math.max(0, Math.min(1, (st*5 - idx*.15)));
          if (p < 1) {
            ctx.fillStyle = 'rgba(10,10,26,'+(1-p)+')';
            ctx.fillRect(ti.x-3, 97, 106, 266);
          }
        });
      }
      break;
  }
  
  // Draw all particles
  particles.forEach(function(p) {
    if (p.delay > 0) return;
    if (p.type === 'coin') {
      drawGoldCoin(p.x, p.y, p.size);
    } else if (p.type === 'bill') {
      var py = p.y + Math.sin(p.wobble)*5;
      drawFlyingBill(p.x, py, p.size*1.5, p.size*.8, p.rot, p.color);
    }
  });
  
  // Draw sparkles
  sparkles.forEach(function(s) {
    var alpha = s.life/s.maxLife;
    ctx.fillStyle = s.color.replace(')', ', '+alpha+')').replace('rgb', 'rgba');
    if (s.color.startsWith('#')) {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = s.color;
    }
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size*alpha, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

// ── Subtitle + Voice ──
function updateSubtitle(t) {
  var script = SCRIPT[getLang()] || SCRIPT['zh-CN'];
  var found = null;
  for (var i = 0; i < script.length; i++) {
    if (t >= script[i].t && t < script[i].t + script[i].d) {
      found = script[i];
      if (lastSubtitleIdx !== i) {
        lastSubtitleIdx = i;
        subEl.textContent = found.txt;
        subEl.style.opacity = '1';
        // Voice
        if (!spokenSubtitles[i]) {
          spokenSubtitles[i] = true;
          try {
            var lang = getLang();
            var u = new SpeechSynthesisUtterance(found.txt);
            u.lang = lang==='zh-CN'?'zh-CN':lang==='zh-TW'?'zh-TW':'en-US';
            u.rate = 1.0; u.pitch = 1.05; u.volume = 0.85;
            speechSynthesis.cancel();
            speechSynthesis.speak(u);
          } catch(e) {}
        }
      }
      return;
    }
  }
  subEl.style.opacity = '0';
  lastSubtitleIdx = -1;
}

// ── Main Loop ──
function loop(ts) {
  if (!startTime) startTime = ts;
  
  if (running) {
    currentTime = (ts - startTime) / 1000;
    if (currentTime > totalTime) {
      running = false;
      currentTime = totalTime;
    }
  }
  
  var scene = getScene(currentTime);
  drawBg(scene, currentTime);
  update(.016);
  renderScene(scene, currentTime);
  updateSubtitle(currentTime);
  
  progEl.style.width = (currentTime / totalTime * 100) + '%';
  
  animId = requestAnimationFrame(loop);
}

// Start immediately
requestAnimationFrame(loop);

// Restart on parent message
window.addEventListener('message', function(e) {
  if (e.data === 'restart') {
    startTime = null;
    currentTime = 0;
    running = true;
    lastSubtitleIdx = -1;
    spokenSubtitles = {};
    sceneInitDone = {};
    particles = [];
    sparkles = [];
    pile1 = 0; pile2 = 0;
    tableCoins = 0;
    billStack = 0;
    subEl.style.opacity = '0';
    speechSynthesis.cancel();
  }
});
</script>
