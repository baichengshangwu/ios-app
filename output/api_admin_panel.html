<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 管理后台 - TokenHub 大模型调用</title>
<style>
:root{
  --bg:#0a0a0f;--bg2:#111118;--bgc:#161622;--bgch:#1c1c2e;
  --bd:#1e1e35;--bda:#333366;
  --t1:#e8e8f0;--t2:#a0a0b8;--t3:#6a6a82;
  --ap:#8b5cf6;--ab:#3b82f6;--ac:#06b6d4;--apk:#ec4899;--ag:#10b981;--ao:#f59e0b;--ar:#ef4444;
  --g1:linear-gradient(135deg,#8b5cf6,#3b82f6);--g2:linear-gradient(135deg,#ec4899,#8b5cf6);
  --r:12px;--rl:16px;--tt:.25s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.6 'Inter','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
/* ===== Top Bar ===== */
.topbar{background:rgba(10,10,18,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);padding:0 24px;display:flex;align-items:center;height:56px;position:sticky;top:0;z-index:100}
.topbar .logo{font-size:17px;font-weight:700;background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:32px}
.topbar nav{display:flex;gap:4px}
.topbar nav a{color:var(--t2);text-decoration:none;padding:6px 14px;border-radius:8px;font-size:13px;transition:var(--tt)}
.topbar nav a:hover,.topbar nav a.active{color:var(--t1);background:var(--bgc)}
.topbar .right{display:flex;align-items:center;gap:12px;margin-left:auto}
.balance-badge{background:var(--bgc);border:1px solid var(--bd);border-radius:20px;padding:4px 14px;font-size:12px;display:flex;align-items:center;gap:6px}
.balance-badge .val{color:var(--ag);font-weight:600;font-family:'SF Mono',monospace}
.balance-badge .nex{color:var(--ap);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:var(--tt)}
.btn-pri{background:var(--g1);color:#fff}.btn-pri:hover{opacity:.85}
.btn-out{background:transparent;border:1px solid var(--bd);color:var(--t2)}.btn-out:hover{border-color:var(--t1);color:var(--t1)}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:6px}
.btn-r{background:var(--ar);color:#fff}.btn-r:hover{opacity:.85}
.btn-g{background:var(--ag);color:#fff}.btn-g:hover{opacity:.85}
/* ===== Layout ===== */
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
.sidebar{background:var(--bg2);border-right:1px solid var(--bd);padding:12px 8px;display:flex;flex-direction:column;gap:4px}
.sidebar .side-item{padding:10px 12px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--t2);display:flex;align-items:center;gap:8px;transition:var(--tt)}
.sidebar .side-item:hover,.sidebar .side-item.active{color:var(--t1);background:var(--bgc)}
.sidebar .side-item .dot{width:6px;height:6px;border-radius:50%;background:var(--t3)}
.sidebar .side-item.active .dot{background:var(--ap)}
.main{padding:24px;overflow-y:auto}
/* ===== Cards ===== */
.card{background:var(--bgc);border:1px solid var(--bd);border-radius:var(--rl);padding:20px;margin-bottom:16px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.card-header h2{font-size:16px;font-weight:600}
.card-header .sub{color:var(--t2);font-size:12px}
/* ===== Stats Row ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--bgc);border:1px solid var(--bd);border-radius:var(--rl);padding:16px}
.stat-card .label{font-size:11px;color:var(--t2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.stat-card .value{font-size:22px;font-weight:700;font-family:'SF Mono',monospace}
.stat-card .value.accent{color:var(--ap)}.stat-card .value.green{color:var(--ag)}.stat-card .value.orange{color:var(--ao)}.stat-card .value.sky{color:var(--ac)}
/* ===== API Key Section ===== */
.api-key-row{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:10px 14px}
.api-key-row code{font-family:'SF Mono',monospace;font-size:12px;color:var(--t2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.api-key-row .key-status{font-size:10px;padding:2px 8px;border-radius:10px}
.api-key-row .key-status.active{background:rgba(16,185,129,.15);color:var(--ag)}
.api-key-row .key-status.inactive{background:rgba(239,68,68,.15);color:var(--ar)}
.create-key-form{display:flex;gap:8px;margin-top:12px}
.create-key-form input{flex:1;background:var(--bg);border:1px solid var(--bd);color:var(--t1);padding:8px 12px;border-radius:var(--r);font-size:13px}
.create-key-form input:focus{outline:none;border-color:var(--ap)}
/* ===== Table ===== */
.table-wrap{border:1px solid var(--bd);border-radius:var(--rl);overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;font-size:13px;border-bottom:1px solid var(--bd)}
th{background:var(--bg2);color:var(--t2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td{color:var(--t1)}tr:hover td{background:var(--bgch)}
.usage-bar{height:4px;background:var(--bd);border-radius:2px;overflow:hidden;margin-top:4px}
.usage-bar .fill{height:100%;border-radius:2px;transition:var(--tt)}.fill.low{background:var(--ag)}.fill.mid{background:var(--ao)}.fill.high{background:var(--ar)}
/* ===== Chat Section ===== */
.chat-split{display:grid;grid-template-columns:280px 1fr;gap:16px}
.model-sidebar{border:1px solid var(--bd);border-radius:var(--rl);overflow:hidden;max-height:500px;display:flex;flex-direction:column}
.model-sidebar .ms-header{padding:12px 14px;background:var(--bg2);border-bottom:1px solid var(--bd);font-weight:600;font-size:13px}
.model-sidebar .ms-search{padding:8px 14px;border-bottom:1px solid var(--bd)}
.model-sidebar .ms-search input{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--t1);padding:6px 10px;border-radius:6px;font-size:12px}
.model-sidebar .ms-search input:focus{outline:none;border-color:var(--ap)}
.model-sidebar .ms-list{flex:1;overflow-y:auto}
.ms-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;font-size:12px;transition:var(--tt)}
.ms-item:hover{background:var(--bgch)}.ms-item.selected{background:rgba(139,92,246,.1);border-left:2px solid var(--ap)}
.ms-item .ms-name{font-weight:500}.ms-item .ms-price{color:var(--t3);font-size:10px}
.chat-box{border:1px solid var(--bd);border-radius:var(--rl);display:flex;flex-direction:column;min-height:400px}
.chat-box .cb-header{padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;font-size:13px}
.chat-box .cb-model{background:rgba(139,92,246,.15);color:var(--ap);padding:2px 10px;border-radius:10px;font-size:11px}
.chat-box .cb-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:320px}
.chat-box .cb-msg{max-width:85%;padding:10px 14px;border-radius:var(--r);font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.cb-msg.user{align-self:flex-end;background:var(--g1);color:#fff;border-bottom-right-radius:4px}
.cb-msg.assistant{align-self:flex-start;background:var(--bg);border:1px solid var(--bd);border-bottom-left-radius:4px}
.cb-msg.system{align-self:center;color:var(--t2);font-size:11px;font-style:italic;background:transparent}
.chat-box .cb-input{padding:12px 16px;border-top:1px solid var(--bd);display:flex;gap:8px}
.chat-box .cb-input textarea{flex:1;background:var(--bg);border:1px solid var(--bd);color:var(--t1);padding:8px 12px;border-radius:8px;font-size:13px;resize:none;min-height:42px;font-family:inherit}
.chat-box .cb-input textarea:focus{outline:none;border-color:var(--ap)}
.chat-box .cb-input button{padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:var(--g1);color:#fff;align-self:flex-end}
.chat-box .cb-input button:disabled{opacity:.4;cursor:not-allowed}
/* ===== Logs ===== */
.log-item{font-family:'SF Mono',monospace;font-size:11px;padding:6px 0;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;color:var(--t2)}
.log-item .log-model{color:var(--ap);min-width:160px}.log-item .log-time{color:var(--t3)}.log-item .log-cost{color:var(--ag);font-weight:600}
/* ===== Recharge Modal ===== */
.mo-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:200;justify-content:center;align-items:center}
.mo-overlay.show{display:flex}
.mo{background:var(--bgc);border:1px solid var(--bd);border-radius:var(--rl);padding:24px;max-width:420px;width:90%;max-height:80vh;overflow-y:auto}
.mo h3{margin-bottom:16px;font-size:16px}
.mo .amt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mo .amt-btn{padding:10px;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg);color:var(--t1);cursor:pointer;font-size:13px;text-align:center;transition:var(--tt)}
.mo .amt-btn:hover,.mo .amt-btn.active{border-color:var(--ap);background:rgba(139,92,246,.1)}
.mo input[type=number]{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--t1);padding:10px 12px;border-radius:var(--r);font-size:14px;margin-bottom:12px}
.mo .preview{padding:10px;background:var(--bg);border-radius:var(--r);text-align:center;margin-bottom:12px;font-size:13px}
.mo .preview span{color:var(--ag);font-weight:700;font-size:16px}
.mo .pay-btns{display:flex;gap:8px}
.mo .pay-btns button{flex:1;padding:10px;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;border:none}
.mo .close-btn{position:absolute;top:8px;right:12px;background:none;border:none;color:var(--t2);font-size:20px;cursor:pointer}
/* ===== Empty State ===== */
.empty{padding:40px;text-align:center;color:var(--t2)}
.empty .icon{font-size:40px;margin-bottom:12px;opacity:.5}
/* Vendor Tabs */
.vendor-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.vtab{padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid var(--bd);color:var(--t2);background:transparent;transition:var(--tt)}
.vtab:hover,.vtab.active{border-color:var(--ap);color:var(--ap);background:rgba(139,92,246,.08)}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="logo">API 管理后台</div>
  <nav>
    <a href="#" class="active" onclick="switchSection('overview')" data-apikey="ap_overview">概览</a>
    <a href="#" onclick="switchSection('keys')" data-apikey="ap_keys">API 密钥</a>
    <a href="#" onclick="switchSection('chat')" data-apikey="ap_chat">模型调用</a>
    <a href="#" onclick="switchSection('logs')" data-apikey="ap_logs">调用记录</a>
  </nav>
  <div class="right">
    <button class="btn btn-out btn-sm back-btn" onclick="goBack()" data-apikey="ap_back" style="margin-right:8px">&#8592; 返回</button>
    <div class="balance-badge">
      <span style="color:var(--t2)">联盟币:</span>
      <span class="val" id="acBalance">0.00</span>
      <span style="color:var(--t2);margin-left:4px">AC</span>
    </div>
    <div class="balance-badge">
      <span style="color:var(--t2)" data-apikey="ap_balance">账户余额:</span>
      <span class="nex" id="accountBalance">0.00</span>
    </div>
  </div>
</div>

<div class="layout">

<!-- Sidebar -->
<div class="sidebar">
  <div class="side-item active" data-section="overview" onclick="switchSection('overview')"><span class="dot"></span><span data-apikey="ap_sys_overview">系统概览</span></div>
  <div class="side-item" data-section="keys" onclick="switchSection('keys')"><span class="dot"></span><span data-apikey="ap_key_mgmt">API 密钥管理</span></div>
  <div class="side-item" data-section="chat" onclick="switchSection('chat')"><span class="dot"></span><span data-apikey="ap_model_center">模型调用中心</span></div>
  <div class="side-item" data-section="logs" onclick="switchSection('logs')"><span class="dot"></span><span data-apikey="ap_call_logs">调用日志</span></div>

</div>

<!-- Main Content -->
<div class="main" id="mainContent"></div>

</div>

<script>
// ========== Data Store ==========
const LS_PREFIX = 'tokenhub_admin_';
function lsGet(k){try{return JSON.parse(localStorage.getItem(LS_PREFIX+k))}catch(e){return null}}
function lsSet(k,v){localStorage.setItem(LS_PREFIX+k,JSON.stringify(v))}

// Default API key (user's existing key - can be overridden)
let state = {
  acBalance: parseFloat(lsGet('acBalance')) || 1000,
  accountBalance: parseFloat(lsGet('accountBalance')) || 0,
  apiKeys: lsGet('apiKeys') || [
    {id:'KH-'+Date.now().toString(36), name:'nexus-app', key:'sk-nexus-app-default', status:'active', created:Date.now(), usage:0, limit:10000},
  ],
  callLogs: lsGet('callLogs') || [],
  activeKey: lsGet('activeKey') || null,
  currentSection: 'overview',
};

function saveState(){
  lsSet('acBalance', state.acBalance);
  lsSet('accountBalance', state.accountBalance);
  lsSet('apiKeys', state.apiKeys);
  lsSet('callLogs', state.callLogs.slice(-500));
  lsSet('activeKey', state.activeKey);
}

// ========== Models Data ==========
const VENDOR_GROUPS = [
  {name:'Anthropic / Claude', models:[
    {id:'claude-opus-4-6',name:'Claude Opus 4.6',in:84,out:210},
    {id:'claude-opus-4-6-thinking',name:'Claude Opus 4.6 Thinking',in:84,out:210},
    {id:'claude-opus-4-7',name:'Claude Opus 4.7',in:56,out:140},
    {id:'claude-opus-4-8',name:'Claude Opus 4.8',in:12,out:210},
    {id:'claude-sonnet-4-6',name:'Claude Sonnet 4.6',in:16.8,out:84},
    {id:'claude-sonnet-4-6-thinking',name:'Claude Sonnet 4.6 Thinking',in:3.6,out:18},
    {id:'relaypool/claude-opus-4-6',name:'Opus 4.6 (Relay)',in:28,out:140},
    {id:'relaypool/claude-opus-4-7',name:'Opus 4.7 (Relay)',in:28,out:140},
    {id:'relaypool/claude-opus-4-8',name:'Opus 4.8 (Relay)',in:28,out:140},
    {id:'relaypool/claude-sonnet-4-6',name:'Sonnet 4.6 (Relay)',in:16.8,out:72},
    {id:'relaypool/claude-sonnet-5',name:'Sonnet 5 (Relay)',in:11.2,out:56},
    {id:'unipass/claude-opus-4-6',name:'Opus 4.6 (UniPass)',in:28,out:140},
    {id:'unipass/claude-opus-4-7',name:'Opus 4.7 (UniPass)',in:28,out:140},
    {id:'unipass/claude-opus-4-8',name:'Opus 4.8 (UniPass)',in:28,out:140},
    {id:'unipass/claude-sonnet-4-6',name:'Sonnet 4.6 (UniPass)',in:11.2,out:56},
  ]},
  {name:'OpenAI / GPT', models:[
    {id:'gpt-5.3-codex',name:'GPT-5.3 Codex',in:2.1,out:16.8},
    {id:'gpt-5.4',name:'GPT-5.4',in:3,out:18},
    {id:'gpt-5.4-pro',name:'GPT-5.4 Pro',in:36,out:216},
    {id:'gpt-5.5',name:'GPT-5.5',in:84,out:252},
    {id:'gpt-5.5-instant',name:'GPT-5.5 Instant',in:90,out:540},
    {id:'gpt-image-1.5',name:'GPT Image 1.5',in:6,out:38.4},
    {id:'gpt-image-2',name:'GPT Image 2',in:6,out:36},
    {id:'relaypool/gpt-5.4',name:'GPT-5.4 (Relay)',in:28,out:84},
    {id:'relaypool/gpt-5.5',name:'GPT-5.5 (Relay)',in:56,out:168},
    {id:'relaypool/gpt-5.6',name:'GPT-5.6 (Relay)',in:56,out:168},
    {id:'relaypool/gpt-5.6-luna',name:'GPT-5.6 Luna (Relay)',in:5.6,out:33.6},
    {id:'relaypool/gpt-5.6-sol',name:'GPT-5.6 Sol (Relay)',in:56,out:168},
    {id:'relaypool/gpt-5.6-terra',name:'GPT-5.6 Terra (Relay)',in:28,out:84},
    {id:'unipass/gpt-5.4',name:'GPT-5.4 (UniPass)',in:28,out:84},
    {id:'unipass/gpt-5.5',name:'GPT-5.5 (UniPass)',in:56,out:168},
    {id:'unipass/gpt-5.6',name:'GPT-5.6 (UniPass)',in:56,out:168},
    {id:'unipass/gpt-5.6-luna',name:'GPT-5.6 Luna (UniPass)',in:28,out:84},
    {id:'unipass/gpt-5.6-sol',name:'GPT-5.6 Sol (UniPass)',in:56,out:168},
    {id:'unipass/gpt-5.6-terra',name:'GPT-5.6 Terra (UniPass)',in:5.6,out:33.6},
  ]},
  {name:'DeepSeek', models:[
    {id:'deepseek-r1',name:'DeepSeek R1',in:0.8,out:1.6},
    {id:'deepseek-v3.2',name:'DeepSeek V3.2',in:0.58,out:1.68},
    {id:'deepseek-v4-flash',name:'DeepSeek V4 Flash',in:0.14,out:0.28},
    {id:'deepseek-v4-pro',name:'DeepSeek V4 Pro',in:1.74,out:3.48},
  ]},
  {name:'Alibaba / Qwen', models:[
    {id:'qwen2.5-vl-embedding',name:'Qwen2.5 VL Embedding',in:1.8,out:1.8},
    {id:'qwen3-32b-AWQ',name:'Qwen3 32B AWQ',in:0.12,out:0.48},
    {id:'qwen3-rerank',name:'Qwen3 Rerank',in:0.5,out:1},
    {id:'qwen3.5-plus',name:'Qwen3.5 Plus',in:1.5,out:7},
    {id:'qwen3.6-plus',name:'Qwen3.6 Plus',in:1.5,out:7},
    {id:'qwen3.7-max',name:'Qwen3.7 Max',in:12,out:36},
    {id:'qwen3.7-plus',name:'Qwen3.7 Plus',in:2,out:8},
  ]},
  {name:'Zhipu AI / GLM', models:[
    {id:'glm-4.7',name:'GLM-4.7',in:2,out:8},
    {id:'glm-5',name:'GLM-5',in:4,out:6},
    {id:'glm-5-turbo',name:'GLM-5 Turbo',in:5,out:7},
    {id:'glm-5.1',name:'GLM-5.1',in:6,out:24},
    {id:'glm-5.2',name:'GLM-5.2',in:8,out:28},
  ]},
  {name:'MoonshotAI / Kimi', models:[
    {id:'kimi-k2.5',name:'Kimi K2.5',in:4,out:21},
    {id:'kimi-k2.6',name:'Kimi K2.6',in:5,out:25},
  ]},
  {name:'其他厂商', models:[
    {id:'doubao-seedance-2.0',name:'Doubao Seedance 2.0',in:25.2,out:41.4},
    {id:'MiniMax-M2.5',name:'MiniMax M2.5',in:1.5,out:6},
    {id:'text-embedding-v4',name:'Text Embedding V4',in:0.5,out:0.5},
    {id:'tongyi-embedding-vision-plus',name:'Tongyi Embedding Vision',in:0.5,out:0.5},
    {id:'happyhorse-1.0-t2v',name:'HappyHorse 1.0 T2V',in:28,out:42},
  ]},
];

const FLAT_MODELS = {};
VENDOR_GROUPS.forEach(g => g.models.forEach(m => FLAT_MODELS[m.id] = m));

const API_BASE = 'https://tokenhub.wetok.ai/v1';
let selectedModel = null;
let modelFilter = 'all';
let modelSearch = '';

// ========== Navigation ==========
function switchSection(s){state.currentSection=s;render();}

function render(){
  document.querySelectorAll('.side-item').forEach(el=>el.classList.toggle('active',el.dataset.section===state.currentSection));
  document.querySelectorAll('.topbar nav a').forEach(el=>{const t=el.getAttribute('onclick')||'';el.classList.toggle('active',t.includes("'"+state.currentSection+"'"))});
  document.getElementById('acBalance').textContent = state.acBalance.toLocaleString();
  document.getElementById('accountBalance').textContent = state.accountBalance.toLocaleString();
  const sec = state.currentSection;
  if(sec==='overview') renderOverview();
  else if(sec==='keys') renderKeys();
  else if(sec==='chat') renderChat();
  else if(sec==='logs') renderLogs();
}

async function renderOverview(){
  const activeKeys = state.apiKeys.filter(k=>k.status==='active');
  const totalModels = Object.keys(FLAT_MODELS).length;

  // Fetch real usage stats from D1
  let usageData = null, overview = null, perUser = [];
  try{
    const creds = getAdminCreds();
    const u = new URL('/api/admin/usage?detail=1', window.location.origin);
    u.searchParams.set('admin_email', creds.email);
    u.searchParams.set('admin_pass', creds.pass);
    const resp = await fetch(u.toString());
    usageData = await resp.json();
    if(usageData && usageData.ok){
      overview = usageData.overview;
      perUser = usageData.per_user || [];
    }
  }catch(e){console.warn('Usage API fetch failed:', e);}

  const totalCalls = overview ? overview.total_calls : state.callLogs.length;
  const totalCost = overview ? overview.total_ac_deducted : state.callLogs.reduce((s,l)=>s+(l.cost||0),0);

function filterChatModels(){

function getFilteredModels(){

  if(modelSearch) all=all.filter(m=>m.id.toLowerCase().includes(modelSearch)||m.name.toLowerCase().includes(modelSearch));

function selectChatModel(id){

// ========== API Keys ==========
function createApiKey(){
  const name=document.getElementById('newKeyName')?.value?.trim();
  if(!name) return alert('请输入密钥名称');
  const key='sk-'+Array.from(crypto.getRandomValues(new Uint8Array(24))).map(b=>b.toString(16).padStart(2,'0')).join('');
  state.apiKeys.push({id:'KH-'+Date.now().toString(36),name,key,status:'active',created:Date.now(),usage:0,limit:10000});
  saveState();renderKeys();
}
function toggleKey(i){state.apiKeys[i].status=state.apiKeys[i].status==='active'?'inactive':'active';saveState();renderKeys();}
function deleteKey(i){if(confirm('确定删除此密钥？')){state.apiKeys.splice(i,1);saveState();renderKeys();}}
function copyKey(key){navigator.clipboard?.writeText(key)||prompt('复制密钥:',key)}

// ========== Chat ==========
async function sendChat(){
  if(!selectedModel) return;
  const input=document.getElementById('chatInput');
  const msg=input.value.trim();
  if(!msg) return;
  input.value='';input.disabled=true;document.getElementById('sendChatBtn').disabled=true;

  const chatArea=document.getElementById('chatArea');
  const es=chatArea.querySelector('.empty');if(es)es.remove();
  addChatMsg('user',msg);

  const loadDiv=addChatMsg('assistant','思考中...');

  // Get active key
  const activeKey=state.apiKeys.find(k=>k.status==='active');
  const apiKey=activeKey?.key||'';

  try{
    const resp=await fetch(API_BASE+'/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify({model:selectedModel,messages:[{role:'user',content:msg}],max_tokens:2048})
    });
    const data=await resp.json();
    if(data.error){
      loadDiv.textContent='错误: '+data.error.message;
      loadDiv.style.color='var(--ar)';
    }else if(data.choices?.[0]){
      loadDiv.textContent=data.choices[0].message.content;
      // Estimate cost
      const model=FLAT_MODELS[selectedModel];
      if(model){
        const inTokens=msg.length*0.7;
        const outTokens=loadDiv.textContent.length*0.7;
        const cost=(inTokens*model.in+outTokens*model.out)/1e6;
        state.callLogs.push({time:Date.now(),model:selectedModel,prompt:msg.substring(0,200),cost});
        state.acBalance=Math.max(0,state.acBalance-cost);
        saveState();
        // Sync balance back to parent
        try{
          if(window.parent && window.parent !== window && window.parent.curUser){
            window.parent.curUser.bal = state.acBalance;
            window.parent.saveSession();
          }
        }catch(e){}
        render();
      }
    }else{loadDiv.textContent='未获取到回复';}
  }catch(e){loadDiv.textContent='网络错误: '+e.message;loadDiv.style.color='var(--ar)'}

  input.disabled=false;document.getElementById('sendChatBtn').disabled=false;input.focus();
  chatArea.scrollTop=chatArea.scrollHeight;
}
function addChatMsg(role,text){
  const area=document.getElementById('chatArea');
  const d=document.createElement('div');d.className='cb-msg '+role;d.textContent=text;
  area.appendChild(d);area.scrollTop=area.scrollHeight;return d;
}

// ========== Parent Balance Sync ==========
function syncBalanceFromParent(){
  try{
    if(window.parent && window.parent !== window && window.parent.curUser){
      var bal = window.parent.curUser.bal || 0;
      if(bal !== state.acBalance){
        state.acBalance = bal;
        saveState();
        render();
      }
      var accBal = window.parent.curUser.recharged || window.parent.curUser.total_recharge || 0;
      document.getElementById('accountBalance').textContent = accBal.toLocaleString();
    }
  }catch(e){}
}

function clearLogs(){if(confirm('确定清空所有调用记录？')){state.callLogs=[];saveState();renderLogs();}}

// ========== Admin Auth Helpers ==========
function getAdminCreds(){
  try{
    if(window.parent && window.parent !== window && window.parent.curUser){
      var email = window.parent.curUser._email || window.parent.curUser.email || '';
      var pass = window.parent.curUser._pass || window.parent.curUser.pass || '';
      if(email && pass) return {email: email, pass: pass};
    }
  }catch(e){}
  // Fallback: try localStorage from parent domain
  try{
    var email = localStorage.getItem('nexus_cur_user_email') || '';
    var users = JSON.parse(localStorage.getItem('nexus_users') || '[]');
    var user = users.find(function(u){return u._email===email||u.email===email;});
    if(user){
      return {email: email, pass: user._pass||user.pass||''};
    }
  }catch(e){}
  return {email:'demo@ai.com', pass:'demo123'};
}

function formatTokens(n){
  if(!n) return '-';
  n = Number(n);
  if(n>=1e9) return (n/1e9).toFixed(1)+'B';
  if(n>=1e6) return (n/1e6).toFixed(1)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'K';
  return n.toLocaleString();
}

function formatTime(t){
  if(!t) return '-';
  if(typeof t==='number') return new Date(t).toLocaleString();
  return new Date(t).toLocaleString();
}

// Init
document.addEventListener('DOMContentLoaded',()=>{
  render();
  applyParentI18N();
  syncBalanceFromParent();
  // Listen for balance updates from parent
  try{
    window.addEventListener('message', function(e){
      if(e.data && e.data.type === 'acBalanceUpdate'){
        state.acBalance = e.data.balance || 0;
        saveState();
        document.getElementById('acBalance').textContent = state.acBalance.toLocaleString();
      }
      if(e.data && e.data.type === 'langChange'){
        setTimeout(applyParentI18N, 10);
      }
    });
    // Periodic sync
    setInterval(syncBalanceFromParent, 3000);
  }catch(e){}
});

// Language codes mapping (same as parent)
const LANG_CODES = ['zh','en','ja','ko','es','fr','de','pt','ru','ar','hi','th','vi','id'];

function detectParentLang(){
  try{
    if(window.parent && window.parent !== window && window.parent.curLang){
      return window.parent.curLang;
    }
  }catch(e){}
  return 'zh';
}

function tApi(key){
  var lang = detectParentLang();
  if(API_I18N_KEYS[key] && API_I18N_KEYS[key][lang]) return API_I18N_KEYS[key][lang];
  if(API_I18N_KEYS[key] && API_I18N_KEYS[key]['zh']) return API_I18N_KEYS[key]['zh'];
  return key;
}

function applyParentI18N(){
  // Update all elements with data-apikey
  document.querySelectorAll('[data-apikey]').forEach(function(el){
    var k = el.getAttribute('data-apikey');
    if(el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'number')){
      el.placeholder = tApi(k);
    } else {
      el.textContent = tApi(k);
    }
  });
  // Listen for parent language changes
  try{
    window.addEventListener('message', function(e){
      if(e.data && e.data.type === 'langChange'){
        setTimeout(applyParentI18N, 10);
      }
    });
  }catch(e){}
}
