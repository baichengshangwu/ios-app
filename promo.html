@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(0,180,255,0.4)}50%{box-shadow:0 0 40px rgba(123,47,255,0.6)}}
.subtitle-bar{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);padding:14px 36px;border-radius:14px;font-size:1.25em;text-align:center;max-width:85%;line-height:1.6;transition:opacity 0.4s;backdrop-filter:blur(10px)}
.progress-bar{position:absolute;bottom:50px;left:10%;width:80%;height:5px;background:rgba(255,255,255,0.15);border-radius:3px}
.progress-fill{height:100%;background:linear-gradient(90deg,#00b4ff,#7b2fff);border-radius:3px;transition:width 0.3s}
.controls{position:absolute;bottom:12px;right:24px;display:flex;gap:10px;z-index:100}
.controls button{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.25);color:#fff;padding:10px 18px;border-radius:10px;cursor:pointer;font-size:0.95em;transition:all 0.25s}
.controls button:hover{background:rgba(255,255,255,0.22)}
.lang-select{position:absolute;top:16px;right:24px;z-index:100;background:rgba(0,0,0,0.75);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:10px 16px;border-radius:10px;font-size:0.95em;cursor:pointer;backdrop-filter:blur(8px)}

.stats-overlay{display:flex;gap:24px;margin:16px 0;flex-wrap:wrap;justify-content:center}
.stat-box{background:rgba(0,180,255,0.08);border:1px solid rgba(0,180,255,0.25);border-radius:12px;padding:18px 28px;text-align:center}
.stat-box .num{font-size:2em;font-weight:700;color:#00b4ff}
.stat-box .label{font-size:0.85em;color:#99a;margin-top:6px}
.cascade-icons{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.cascade-icons span{background:rgba(255,255,255,0.07);padding:10px 20px;border-radius:10px;font-size:1.05em;border:1px solid rgba(255,255,255,0.1)}
.slide-indicator{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.5);font-size:0.8em}
.timer-display{position:absolute;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font-size:0.85em}
audio{display:none}

// Auto-detect language from URL param or parent window
function detectLang(){
  const urlParams = new URLSearchParams(window.location.search);
  const urlLang = urlParams.get('lang');
  if(urlLang && L[urlLang]) return urlLang;
  // Check if embedded and parent has language info
  try {
    if(window.parent && window.parent !== window){
      const parentLang = window.parent.document.documentElement.lang;
      if(parentLang && L[parentLang]) return parentLang;
    }
  } catch(e) {}
  // Try browser language
  const navLang = navigator.language || navigator.userLanguage;
  if(navLang){
    if(navLang.startsWith('zh')){
      if(navLang.includes('TW')||navLang.includes('HK')) return 'zh-TW';
      return 'zh-CN';
    }
    if(L[navLang]) return navLang;
    const base = navLang.split('-')[0];
    if(L[base]) return base;
  }
  return 'zh-CN';
}

    if(ldata['d'+i]) html+='<div class="desc">'+ldata['d'+i]+'</div>';
    if(s.icons){
      const iconMap = {'zh-CN':['📊 行情','🔧 工具','🤝 P2P','💱 交易'],'zh-TW':['📊 行情','🔧 工具','🤝 P2P','💱 交易'],'en':['📊 Market','🔧 Tools','🤝 P2P','💱 Trade'],'ja':['📊 マーケット','🔧 ツール','🤝 P2P','💱 取引'],'ko':['📊 마켓','🔧 도구','🤝 P2P','💱 거래'],'es':['📊 Mercado','🔧 Herramientas','🤝 P2P','💱 Trading'],'fr':['📊 Marché','🔧 Outils','🤝 P2P','💱 Trading'],'de':['📊 Markt','🔧 Tools','🤝 P2P','💱 Handel'],'pt':['📊 Mercado','🔧 Ferramentas','🤝 P2P','💱 Trading'],'ru':['📊 Рынок','🔧 Инструменты','🤝 P2P','💱 Торговля'],'ar':['📊 السوق','🔧 أدوات','🤝 P2P','💱 تداول'],'hi':['📊 बाजार','🔧 टूल','🤝 P2P','💱 ट्रेड'],'th':['📊 ตลาด','🔧 เครื่องมือ','🤝 P2P','💱 เทรด'],'vi':['📊 Thị trường','🔧 Công cụ','🤝 P2P','💱 Giao dịch'],'id':['📊 Pasar','🔧 Alat','🤝 P2P','💱 Perdagangan'],'it':['📊 Mercato','🔧 Strumenti','🤝 P2P','💱 Trading']};
      const icons = iconMap[lang] || iconMap['en'] || s.icons;
      html+='<div class="cascade-icons">'+icons.map(ic=>'<span>'+ic+'</span>').join('')+'</div>';
    }
    if(s.img) html+='<img src="'+s.img+'" alt="" onerror="this.parentElement.querySelector(\'.title\').textContent+=\' [图片加载中]\'">';
    if(s.stats){
      html+='<div class="stats-overlay">'+s.stats.map((st,j)=>{
        const labelKey = statLabels[j]||'';
        const label = (L[lang]&&L[lang][labelKey])||(L['zh-CN']&&L['zh-CN'][labelKey])||labelKey;
        return '<div class="stat-box"><div class="num">'+st.n+'</div><div class="label">'+label+'</div></div>';
      }).join('')+'</div>';
    }
    if(s.cta) html+='<a href="https://zhitongwang.cn" target="_blank" style="text-decoration:none"><div class="cta">'+ldata.cta1+'</div></a>';
    if(s.cta2) html+='<a href="https://zhitongwang.cn" target="_blank" style="text-decoration:none"><div class="cta">'+ldata.cta2+'</div></a>';
    d.innerHTML=html;
    c.appendChild(d);
  });
  updateUI();
  loadAudio();
  startAuto();
}

function loadAudio(){
  const a=document.getElementById('audioPlayer');
  const map={
    'zh-CN':'promo_audio_zh-CN.mp3','zh-TW':'promo_audio_zh-TW.mp3','en':'promo_audio_en.mp3',
    'ja':'promo_audio_ja.mp3','ko':'promo_audio_ko.mp3','es':'promo_audio_es.mp3',
    'fr':'promo_audio_fr.mp3','de':'promo_audio_de.mp3','pt':'promo_audio_pt.mp3',
    'ru':'promo_audio_ru.mp3','ar':'promo_audio_ar.mp3','hi':'promo_audio_hi.mp3',
    'th':'promo_audio_th.mp3','vi':'promo_audio_vi.mp3','id':'promo_audio_id.mp3',
    'it':'promo_audio_it.mp3'
  };
  a.src=map[lang]||'promo_audio_en.mp3';
  a.load();
}

function startAuto(){
  if(!playing)return;
  if(timer)clearTimeout(timer);
  const dur=slides[idx].t*1000;
  animateProgress(dur);
  const a=document.getElementById('audioPlayer');
  if(a.paused) a.play().catch(()=>{});
  timer=setTimeout(()=>{
    if(idx<slides.length-1){idx++;showSlide();}else{stop();}
  },dur);
}

function animateProgress(dur){
  const bar=document.getElementById('progressFill'), start=Date.now();
  function tick(){
    const pct=Math.min((Date.now()-start)/dur*100,100);
    bar.style.width=pct+'%';
    if(pct<100&&playing)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function showSlide(){
  document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('active',i===idx));
  updateUI();
  if(playing) startAuto();
}

function updateUI(){
  const subtitleData = subs[lang] || subs['zh-CN'];
  document.getElementById('subtitleBar').textContent = subtitleData[idx]||'';
  document.getElementById('slideIndicator').textContent = (idx+1)+' / '+slides.length;
  elapsed=slides.slice(0,idx).reduce((s,sl)=>s+sl.t,0);
  const total=slides.reduce((s,sl)=>s+sl.t,0);
  const m1=Math.floor(elapsed/60),s1=Math.floor(elapsed%60);
  const m2=Math.floor(total/60),s2=Math.floor(total%60);
  document.getElementById('timerDisplay').textContent=
    String(m1).padStart(2,'0')+':'+String(s1).padStart(2,'0')+' / '+String(m2).padStart(2,'0')+':'+String(s2).padStart(2,'0');
}

function switchLanguage(){
  lang=document.getElementById('langSelect').value;
  const ldata = L[lang]||L['zh-CN'];
  document.querySelectorAll('.slide').forEach((el,i)=>{
    const t=el.querySelector('.title'), d=el.querySelector('.desc'), c=el.querySelector('.cta');
    if(t) t.textContent = ldata['t'+i]||'';
    if(d) d.textContent = ldata['d'+i]||'';
    if(c) c.textContent = i===16 ? ldata.cta1 : (i===17 ? ldata.cta2 : c.textContent);
    // Update stat labels
    const labels = el.querySelectorAll('.stat-box .label');
    if(labels.length){
      labels.forEach((lb,j)=>{
        const key = statLabels[j];
        if(key && ldata[key]) lb.textContent = ldata[key];
      });
    }
    // Update icons
    if(i===8){
      const icons = el.querySelectorAll('.cascade-icons span');
      if(icons.length>=4){
        const iconMap = {'zh-CN':['📊 行情','🔧 工具','🤝 P2P','💱 交易'],'zh-TW':['📊 行情','🔧 工具','🤝 P2P','💱 交易'],'en':['📊 Market','🔧 Tools','🤝 P2P','💱 Trade'],'ja':['📊 マーケット','🔧 ツール','🤝 P2P','💱 取引'],'ko':['📊 마켓','🔧 도구','🤝 P2P','💱 거래'],'es':['📊 Mercado','🔧 Herramientas','🤝 P2P','💱 Trading'],'fr':['📊 Marché','🔧 Outils','🤝 P2P','💱 Trading'],'de':['📊 Markt','🔧 Tools','🤝 P2P','💱 Handel'],'pt':['📊 Mercado','🔧 Ferramentas','🤝 P2P','💱 Trading'],'ru':['📊 Рынок','🔧 Инструменты','🤝 P2P','💱 Торговля'],'ar':['📊 السوق','🔧 أدوات','🤝 P2P','💱 تداول'],'hi':['📊 बाजार','🔧 टूल','🤝 P2P','💱 ट्रेड'],'th':['📊 ตลาด','🔧 เครื่องมือ','🤝 P2P','💱 เทรด'],'vi':['📊 Thị trường','🔧 Công cụ','🤝 P2P','💱 Giao dịch'],'id':['📊 Pasar','🔧 Alat','🤝 P2P','💱 Perdagangan'],'it':['📊 Mercato','🔧 Strumenti','🤝 P2P','💱 Trading']};
        const map = iconMap[lang]||iconMap['en'];
        if(map) map.forEach((txt,j)=>icons[j].textContent=txt);
      }
    }
  });
  loadAudio();
  updateUI();
}

function nextSlide(){if(idx<slides.length-1){idx++;showSlide();}}
function prevSlide(){if(idx>0){idx--;showSlide();}}
function togglePlay(){
  playing=!playing;
  document.getElementById('playBtn').textContent=playing?'⏸ 暂停':'▶ 播放';
  const a=document.getElementById('audioPlayer');
  playing?a.play().catch(()=>{}):a.pause();
  playing?startAuto():clearTimeout(timer);
}
function stop(){
  playing=false;
  document.getElementById('playBtn').textContent='🔄 重播';
  clearTimeout(timer);
  document.getElementById('progressFill').style.width='100%';
  document.getElementById('audioPlayer').pause();
}
function restart(){idx=0;playing=true;document.getElementById('playBtn').textContent='⏸ 暂停';elapsed=0;showSlide();loadAudio();}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();nextSlide();}
  if(e.key==='ArrowLeft'){e.preventDefault();prevSlide();}
  if(e.key==='p')togglePlay();
});
init();
</script>
</body>
</html>
