<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">AI联盟 - 大模型广场</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #e0e7ff;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-hover: 0 8px 24px rgba(99,102,241,0.12);
            --radius: 12px;
            --radius-sm: 8px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        /* Hero */
        .hero {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #a855f7 100%);
            color: white;
            padding: 50px 0 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.08) 0%, transparent 60%);
        }
        .hero .container { position: relative; z-index: 1; }
        .hero h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .hero .subtitle {
            font-size: 0.95rem;
            opacity: 0.8;
            margin-top: 6px;
        }
        .hero .pricing-banner {
            display: inline-block;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 5px 20px;
            margin-top: 14px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .hero .endpoint-bar {
            display: inline-block;
            background: rgba(0,0,0,0.15);
            border-radius: 6px;
            padding: 4px 16px;
            margin-top: 10px;
            font-size: 0.8rem;
            font-family: 'SF Mono','Fira Code',monospace;
            opacity: 0.75;
        }
        /* Container */
        .container {
            max-width: 1260px;
            margin: 0 auto;
            padding: 0 24px;
        }
        /* Toolbar */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin: 24px 0 16px;
        }
        .toolbar-left {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .search-box {
            position: relative;
            min-width: 220px;
        }
        .search-box input {
            width: 100%;
            padding: 9px 14px 9px 36px;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            font-size: 0.9rem;
            background: white;
            transition: all 0.2s;
            outline: none;
        }
        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
        }
        .search-box .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        /* Group tabs */
        .group-tabs {
            display: flex;
            gap: 4px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 3px;
        }
        .group-tab {
            padding: 7px 16px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .group-tab:hover {
            color: var(--text);
            background: var(--bg);
        }
        .group-tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 1px 3px rgba(99,102,241,0.3);
        }
        /* Stats */
        .stats-bar {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stats-bar .count {
            font-weight: 600;
            color: var(--primary);
        }
        /* Group section */
        .group-section {
            margin-bottom: 36px;
        }
        .group-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .group-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .group-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
        }
        .group-count {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: var(--bg);
            padding: 2px 10px;
            border-radius: 10px;
        }
        .model-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }
        .model-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            transition: all 0.2s;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: default;
        }
        .model-card:hover {
            box-shadow: var(--shadow-hover);
            border-color: #c7d2fe;
            transform: translateY(-1px);
        }
        .model-card.hidden {
            display: none;
        }
        .model-top {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .model-icon {
            font-size: 1.4rem;
            line-height: 1;
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-light);
            border-radius: var(--radius-sm);
        }
        .model-name-row {
            flex: 1;
            min-width: 0;
        }
        .model-name {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text);
            word-break: break-all;
            line-height: 1.3;
        }
        .model-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
        }
        .model-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 8px;
            font-weight: 500;
            white-space: nowrap;
        }
        .badge-type { background: #ede9fe; color: #7c3aed; }
        .badge-provider { background: #fef3c7; color: #d97706; }
        .badge-ac { background: #fce7f3; color: #db2777; }
        .badge-endpoint { background: #d1fae5; color: #059669; font-family: monospace; font-size: 0.65rem; }
        .model-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 1rem;
        }
        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.82rem;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
        @media (max-width: 768px) {
            .hero h1 { font-size: 1.4rem; }
            .model-grid { grid-template-columns: 1fr; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .group-tabs { overflow-x: auto; }
        }
    </style>
</head>
<body>
    <header id="header-placeholder"></header>
    <section class="hero">
        <div class="container">
            <h1 data-i18n="title">AI联盟 - 大模型广场</h1>
            <p class="subtitle">35 个大模型 · 8 家顶级 AI 厂商 · OpenAI 兼容 API</p>
            </div>
    </section>
    <main class="container">
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="搜索模型名称..." data-i18n-search="search_placeholder">
                </div>
                <div class="group-tabs" id="group-tabs">
                    <button class="group-tab active" data-group="provider" data-i18n="tab_provider">按提供商</button>
                    <button class="group-tab" data-group="type" data-i18n="tab_type">按类型</button>
                    <button class="group-tab" data-group="series" data-i18n="tab_series">按系列</button>
                    <button class="group-tab" data-group="owned_by" data-i18n="tab_owned_by">按归属</button>
                    <button class="group-tab" data-group="endpoint" data-i18n="tab_endpoint">按端点</button>
                </div>
            </div>
        </div>
        <div class="stats-bar" id="stats-bar">
            共 <span class="count">35</span> 个模型
        </div>
        <div id="models-container"></div>
    </main>
    <footer>
        <p data-i18n="footer_text">&copy; 2026 THHT Cloud</p>
    </footer>

        function renderModels() {

            Object.keys(groups).forEach(function(groupKey) {
                var g = groups[groupKey];

                    return MODELS.find(function(m) { return m.id === mid; });
                }).filter(Boolean);

                // Apply search filter
                if (searchQuery) {

                    modelsInGroup = modelsInGroup.filter(function(m) {
                        return m.id.toLowerCase().indexOf(q) !== -1;
                    });
                }

                if (modelsInGroup.length === 0 && searchQuery) return;

                var groupColor = stringToColor(groupKey);
