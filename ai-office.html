<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-key="page_title">AI Office - 智能办公团队</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg: #0a0e17;
  --card: #111827;
  --border: #1e293b;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --accent: #6366f1;
  --accent2: #8b5cf6;
  --success: #10b981;
  --warn: #f59e0b;
  --danger: #ef4444;
  --user-bubble: #1e3a5f;
  --agent-bubble: #1a1f2e;
}
body{
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
header{
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
header h1{
  font-size: 17px;
  font-weight: 600;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header-right{
  display: flex;
  align-items: center;
  gap: 16px;
}
.lang-switch{
  position: relative;
}
.lang-switch select{
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 4px 8px;
  font-size: 12px;
  outline: none;
  cursor: pointer;
}
.team-status{
  display: flex;
  gap: 14px;
  align-items: center;
}
.agent-dot{
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--muted);
}
.agent-dot .dot{
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--success);
  animation: pulse 2s infinite;
}
.dot.offline{ background: var(--muted); animation: none; }
.dot.busy{ background: var(--warn); }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:0.5} }

.layout{
  display: flex;
  flex: 1;
  overflow: hidden;
}
.sidebar{
  width: 260px;
  background: var(--card);
  border-right: 1px solid var(--border);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
}
.sidebar h3{
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.agent-card{
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.agent-card:hover{
  border-color: var(--accent);
  transform: translateX(2px);
}
.agent-card.active{
  border-color: var(--accent2);
  background: rgba(99,102,241,0.08);
}
.agent-card .icon{
  font-size: 24px;
  margin-bottom: 4px;
}
.agent-card .name{
  font-size: 13px;
  font-weight: 600;
}
.agent-card .role{
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}
.agent-card .badge{
  display: inline-block;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  margin-top: 6px;
  background: rgba(99,102,241,0.15);
  color: var(--accent);
}

.main{
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.chat-area{
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.welcome-msg{
  text-align: center;
  margin: auto;
  max-width: 500px;
}
.welcome-msg h2{
  font-size: 28px;
  margin-bottom: 12px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.welcome-msg p{
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}
.team-grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
  margin-top: 20px;
}
.team-grid .mini-agent{
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.team-grid .mini-agent:hover{
  border-color: var(--accent);
}
.team-grid .mini-agent .mi{
  font-size: 28px;
  margin-bottom: 4px;
}

.msg{
  display: flex;
  gap: 12px;
  max-width: 80%;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.msg.user{ align-self: flex-end; flex-direction: row-reverse; }
.msg.agent{ align-self: flex-start; }
.msg .avatar{
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.msg.user .avatar{ background: var(--accent); }
.msg.agent .avatar{ background: var(--border); }
.msg .bubble{
  padding: 12px 16px;
  border-radius: 14px;
  line-height: 1.5;
  font-size: 14px;
}
.msg.user .bubble{
  background: var(--user-bubble);
  border-bottom-right-radius: 4px;
}
.msg.agent .bubble{
  background: var(--agent-bubble);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.msg .sender{
  font-size: 11px;
  color: var(--accent);
  margin-bottom: 4px;
  font-weight: 600;
}
.msg .bubble pre{
  background: var(--bg);
  padding: 12px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 8px 0;
  font-size: 12px;
}
.msg .bubble code{
  background: var(--bg);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 12px;
}

.dispatch-card{
  background: var(--card);
  border: 1px dashed var(--accent);
  border-radius: 10px;
  padding: 10px 14px;
  margin: 8px 0;
  font-size: 12px;
  color: var(--muted);
}

.typing-indicator{
  display: flex;
  gap: 4px;
  padding: 8px 0;
}
.typing-indicator span{
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: bounce 1.4s infinite;
}
.typing-indicator span:nth-child(2){ animation-delay: 0.2s; }
.typing-indicator span:nth-child(3){ animation-delay: 0.4s; }
@keyframes bounce{ 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

.input-bar{
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  gap: 10px;
}
.input-bar input{
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 16px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border 0.2s;
}
.input-bar input:focus{ border-color: var(--accent); }
.input-bar input::placeholder{ color: var(--muted); }
.input-bar button{
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
  border: none;
  border-radius: 10px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
.input-bar button:hover{ opacity: 0.9; }
.input-bar button:disabled{ opacity: 0.5; cursor: not-allowed; }
.auto-btn{
  background: transparent !important;
  border: 1px solid var(--border) !important;
  color: var(--muted) !important;
  font-size: 12px !important;
}

@media (max-width: 768px){
  .sidebar{ display: none; }
  .msg{ max-width: 95%; }
  .team-status{ display: none; }
}
</style>
</head>
<body>

<header>
  <h1 data-key="header_title">AI Office - 智能办公团队</h1>
  <div class="header-right">
    <div class="lang-switch">
      <select id="langSelect" onchange="setLang(this.value)">
        <option value="zh-CN">🇨🇳 简体中文</option>
        <option value="zh-TW">🇹🇼 繁體中文</option>
        <option value="en">🇺🇸 English</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="es">🇪🇸 Español</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="pt">🇵🇹 Português</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="hi">🇮🇳 हिन्दी</option>
        <option value="th">🇹🇭 ไทย</option>
        <option value="vi">🇻🇳 Tiếng Việt</option>
        <option value="id">🇮🇩 Bahasa Indonesia</option>
        <option value="it">🇮🇹 Italiano</option>
      </select>
    </div>
    <div class="team-status">
      <div class="agent-dot"><span class="dot" id="dot-manager"></span>Manager</div>
      <div class="agent-dot"><span class="dot" id="dot-file"></span>File Agent</div>
      <div class="agent-dot"><span class="dot" id="dot-search"></span>Search Agent</div>
      <div class="agent-dot"><span class="dot" id="dot-code"></span>Code Agent</div>
      <div class="agent-dot"><span class="dot" id="dot-writer"></span>Writer</div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <h3 data-key="sidebar_title">团队成员</h3>
    <div class="agent-card active" onclick="selectAgent('manager')" id="card-manager">
      <div class="icon">🧠</div>
      <div class="name" data-key="mgr_name">Manager</div>
      <div class="role" data-key="mgr_role">任务调度 & 协调分发</div>
      <div class="badge" data-key="mgr_badge">主控</div>
    </div>
    <div class="agent-card" onclick="selectAgent('file')" id="card-file">
      <div class="icon">📁</div>
      <div class="name" data-key="file_name">File Agent</div>
      <div class="role" data-key="file_role">文件管理 & 数据处理</div>
      <div class="badge" data-key="file_badge">文件</div>
    </div>
    <div class="agent-card" onclick="selectAgent('search')" id="card-search">
      <div class="icon">🔍</div>
      <div class="name" data-key="srch_name">Search Agent</div>
      <div class="role" data-key="srch_role">信息检索 & 资料调研</div>
      <div class="badge" data-key="srch_badge">搜索</div>
    </div>
    <div class="agent-card" onclick="selectAgent('code')" id="card-code">
      <div class="icon">💻</div>
      <div class="name" data-key="code_name">Code Agent</div>
      <div class="role" data-key="code_role">代码分析 & 开发辅助</div>
      <div class="badge" data-key="code_badge">开发</div>
    </div>
    <div class="agent-card" onclick="selectAgent('writer')" id="card-writer">
      <div class="icon">✍️</div>
      <div class="name" data-key="wrt_name">Writer</div>
      <div class="role" data-key="wrt_role">文案撰写 & 内容创作</div>
      <div class="badge" data-key="wrt_badge">创作</div>
    </div>
  </aside>

  <div class="main">
    <div class="chat-area" id="chatArea">
      <div class="welcome-msg">
        <h2 data-key="welcome_h2">AI Office 办公团队</h2>
        <p data-key="welcome_p">一个像 Marvis 办公室一样的智能团队，由 Manager 统一调度，各专业 Agent 分工协作，高效完成你的每一项任务。</p>
      </div>
    </div>
    <div class="input-bar">
      <button class="auto-btn" onclick="toggleAuto()" id="autoBtn">🔀 Auto</button>
      <input type="text" id="msgInput" data-key-placeholder="input_auto" placeholder="输入任务，Manager 将自动分发给最合适的 Agent..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()" id="sendBtn" data-key="send">发送</button>
    </div>
  </div>
</div>

<script>
// ============ i18n ============
const LANG_DATA = JSON.parse(document.getElementById('lang-data-json').textContent);

let curLang = 'zh-CN';
function getLang() { return curLang; }

function L(key) {
  const d = LANG_DATA[curLang];
  if (!d) return key;
  if (d[key] !== undefined) return d[key];
  if (LANG_DATA['zh-CN'] && LANG_DATA['zh-CN'][key] !== undefined) return LANG_DATA['zh-CN'][key];
  return key;
}

function applyI18N() {
  document.querySelectorAll('[data-key]').forEach(el => {
    const k = el.getAttribute('data-key');
    if (!k || k.startsWith('aio_')) return; // skip index.html keys
    const v = L(k);
    if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll('[data-key-placeholder]').forEach(el => {
    const k = el.getAttribute('data-key-placeholder');
    const v = L(k);
    if (v) el.placeholder = v;
  });
  // Update document title
  document.title = L('page_title');
  // Update welcome panel if visible
  updateWelcomePanel();
  updateAutoLabel();
  updateInputPlaceholder();
}

function updateWelcomePanel() {
  const welcome = document.querySelector('.welcome-msg');
  if (!welcome) return;
  const h2 = welcome.querySelector('h2');
  const p = welcome.querySelector('p');
  if (h2 && h2.hasAttribute('data-key')) h2.textContent = L(h2.getAttribute('data-key'));
  if (p && p.hasAttribute('data-key')) p.textContent = L(p.getAttribute('data-key'));
}

function updateAutoLabel() {
  const btn = document.getElementById('autoBtn');
  if (btn) btn.textContent = '🔀 ' + L(state.autoMode ? 'auto_checked' : 'auto');
}

function updateInputPlaceholder() {
  const input = document.getElementById('msgInput');
  if (!input) return;
  if (state.autoMode || state.activeAgent === 'manager') {
    input.setAttribute('data-key-placeholder', 'input_auto');
    input.placeholder = L('input_auto');
  } else {
    input.placeholder = L('input_direct').replace('{name}', AGENTS[state.activeAgent].name);
  }
}

function setLang(lang) {
  if (!LANG_DATA[lang]) return;
  curLang = lang;
  document.getElementById('langSelect').value = lang;
  applyI18N();
  // Re-render chat messages to update dispatch cards
  renderMessages();
}

// ============ Agent definitions ============
const AGENT_ICONS = {
  manager: '🧠', file: '📁', search: '🔍', code: '💻', writer: '✍️'
};
const AGENT_KEY_PREFIX = {
  manager: 'mgr_', file: 'file_', search: 'srch_', code: 'code_', writer: 'wrt_'
};

function getAgentName(id) { return L(AGENT_KEY_PREFIX[id] + 'name') || id; }
function getAgentRole(id) { return L(AGENT_KEY_PREFIX[id] + 'role') || ''; }

const AGENTS = {};
['manager','file','search','code','writer'].forEach(id => {
  AGENTS[id] = {
    id: id,
    get name() { return getAgentName(id); },
    get role() { return getAgentRole(id); },
    icon: AGENT_ICONS[id],
    emoji: id === 'file' ? '📂' : id === 'search' ? '🌐' : id === 'code' ? '⚡' : id === 'writer' ? '📝' : '🧠'
  };
});

// ============ State ============
let state = {
  activeAgent: 'manager',
  autoMode: true,
  messages: [],
  isProcessing: false
};

// ============ UI ============
function selectAgent(id) {
  state.activeAgent = id;
  state.autoMode = false;
  document.querySelectorAll('.agent-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card-' + id);
  if (card) card.classList.add('active');
  updateAutoLabel();
  updateInputPlaceholder();
}

function toggleAuto() {
  state.autoMode = !state.autoMode;
  if (state.autoMode) {
    document.querySelectorAll('.agent-card').forEach(c => c.classList.remove('active'));
    const card = document.getElementById('card-manager');
    if (card) card.classList.add('active');
    state.activeAgent = 'manager';
  }
  updateAutoLabel();
  updateInputPlaceholder();
}

function focusInput() { document.getElementById('msgInput').focus(); }

function setDot(id, status) {
  const dot = document.getElementById('dot-' + id);
  if (!dot) return;
  dot.className = 'dot ' + status;
}

// ============ Render ============
function renderMessages() {
  const chat = document.getElementById('chatArea');
  chat.innerHTML = '';
  if (state.messages.length === 0) {
    chat.innerHTML = '<div class="welcome-msg"><h2 data-key="welcome_h2">' + L('welcome_h2') + '</h2><p data-key="welcome_p">' + L('welcome_p') + '</p></div>';
    return;
  }
  state.messages.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.role === 'user' ? 'user' : 'agent');
    const agent = AGENTS[m.agentId] || AGENTS.manager;
    let bubbleHtml = '';

    if (m.role === 'user') {
      bubbleHtml = m.text.replace(/\n/g, '<br>');
      div.innerHTML = '<div class="avatar">👤</div><div class="bubble">' + bubbleHtml + '</div>';
    } else {
      let dispatchHtml = '';
      if (m.dispatchLog) {
        dispatchHtml = '<div class="dispatch-card">🔀 ' + L('dispatch_flow') + '：' + m.dispatchLog.flow + '</div>';
      }
      let textHtml = m.text
        .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
      div.innerHTML = '<div class="avatar">' + agent.icon + '</div><div class="bubble"><div class="sender">' + agent.name + '</div>' + dispatchHtml + textHtml + '</div>';
    }
    chat.appendChild(div);
  });
  chat.scrollTop = chat.scrollHeight;
}

function addTyping(agentId) {
  const chat = document.getElementById('chatArea');
  const welcome = chat.querySelector('.welcome-msg');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = 'msg agent';
  div.id = 'typing-' + agentId;
  const agent = AGENTS[agentId];
  div.innerHTML = '<div class="avatar">' + agent.icon + '</div><div class="bubble"><div class="sender">' + agent.name + '</div><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping(agentId) {
  const el = document.getElementById('typing-' + agentId);
  if (el) el.remove();
}

// ============ Dispatch ============
function dispatchTask(userMsg) {
  const lower = userMsg.toLowerCase();
  const keywords = {
    file: ['文件','文件夹','路径','读取','写入','保存','删除','重命名','下载','上传','压缩','解压','file','folder','path','read','write','save','delete','rename','download','zip','csv','json','xml'],
    search: ['搜索','查找','查询','调研','对比','最新','新闻','资料','论文','报告','排行','search','find','query','research','latest','news','compare','paper','report','price'],
    code: ['代码','编程','函数','bug','错误','调试','算法','接口','api','前端','后端','数据库','code','function','debug','error','algorithm','sql','python','js','html','css','git'],
    writer: ['写','翻译','文案','文章','文档','报告','邮件','润色','总结','摘要','介绍','write','translate','article','email','document','summary','polish','essay']
  };

  let scores = { file: 0, search: 0, code: 0, writer: 0 };
  Object.entries(keywords).forEach(([agent, words]) => {
    words.forEach(w => { if (lower.includes(w.toLowerCase())) scores[agent] += 1; });
  });

  let best = 'file', bestScore = 0, ties = [];
  Object.entries(scores).forEach(([agent, score]) => {
    if (score > bestScore) { bestScore = score; best = agent; ties = [agent]; }
    else if (score === bestScore && score > 0) { ties.push(agent); }
  });
  if (bestScore === 0) best = 'manager';
  else if (ties.length > 1) best = 'manager';
  return best;
}

// ============ Generate Response ============
function generateResponse(agentId, userMsg) {
  const lower = userMsg.toLowerCase();
  const lang = curLang;

  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  const prefixes = {
    manager: ['rsp_mgr_1','rsp_mgr_2','rsp_mgr_3'],
    file: ['rsp_file_1','rsp_file_2','rsp_file_3'],
    search: ['rsp_srch_1','rsp_srch_2','rsp_srch_3'],
    code: ['rsp_code_1','rsp_code_2','rsp_code_3'],
    writer: ['rsp_wrt_1','rsp_wrt_2','rsp_wrt_3']
  };

  let prefix = L(pick(prefixes[agentId] || prefixes.manager));
  let body = '';

  if (agentId === 'file') {
    if (lower.includes('搜索') || lower.includes('找') || lower.includes('search') || lower.includes('find')) {
      body = L('rsp_gen_file_search') + '\n\n```\nsearch: ' + userMsg + '\ntarget: /workspace/\nstatus: ready\n```';
    } else if (lower.includes('读') || lower.includes('查看') || lower.includes('read')) {
      body = L('rsp_gen_file_read');
    } else {
      body = L('rsp_gen_file_default');
    }
  } else if (agentId === 'search') {
    body = L('rsp_gen_srch') + '\n\n| ' + L('table_dim') + ' | ' + L('table_content') + ' |\n|------|------|\n| ' + L('table_topic') + ' | ' + userMsg + ' |\n| ' + L('table_source') + ' | ' + L('table_multi_source') + ' |\n| ' + L('table_status') + ' | ' + L('table_ready') + ' |';
  } else if (agentId === 'code') {
    if (lower.includes('生成') || lower.includes('写') || lower.includes('generate') || lower.includes('write')) {
      body = '```javascript\n' + L('rsp_gen_code_gen') + '\nfunction main() {\n  // ' + userMsg + '\n  console.log("Hello from Code Agent");\n}\n```';
    } else if (lower.includes('错') || lower.includes('bug') || lower.includes('error')) {
      body = L('rsp_gen_code_bug') + '\n1. Check call stack for exception point\n2. Review variable scope and types\n3. Verify boundary conditions\n\nPlease provide complete error details for precise diagnosis.';
    } else {
      body = L('rsp_gen_code_default') + '\n- Language: JavaScript/Python\n- Architecture: Modular design\n- Dependencies: Minimal external libraries\n\nConfirm to proceed with implementation.';
    }
  } else if (agentId === 'writer') {
    if (lower.includes('翻译') || lower.includes('translate')) {
      body = L('rsp_gen_wrt_trans');
    } else {
      body = L('rsp_gen_wrt_default') + '\n\n---\n**Key Points**\n1. Structured presentation with clear hierarchy\n2. Key information highlighted\n3. Style matched to target scenario\n\n---\n\nConfirm direction, can refine further.';
    }
  } else {
    body = 'Manager has completed task analysis. Please clarify requirements for detailed execution.';
  }

  return prefix + '\n\n' + body;
}

// ============ Send Message ============
function sendMsg() {
  if (state.isProcessing) return;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  const welcome = document.getElementById('chatArea').querySelector('.welcome-msg');
  if (welcome) welcome.remove();

  // User message
  state.messages.push({ role: 'user', agentId: 'manager', text: text, dispatchLog: null, time: Date.now() });

  // Auto dispatch
  let targetAgent = state.activeAgent;
  let dispatchLog = null;

  if (state.autoMode || state.activeAgent === 'manager') {
    const dispatched = dispatchTask(text);
    if (dispatched !== 'manager') {
      targetAgent = dispatched;
      dispatchLog = { flow: 'Manager → ' + getAgentName(dispatched) };
    }
  }

  state.isProcessing = true;
  document.getElementById('sendBtn').disabled = true;
  setDot(targetAgent, 'busy');
  addTyping(targetAgent);

  const delay = 800 + Math.random() * 1200;
  setTimeout(() => {
    removeTyping(targetAgent);
    setDot(targetAgent, '');
    const response = generateResponse(targetAgent, text);
    state.messages.push({ role: 'agent', agentId: targetAgent, text: response, dispatchLog: dispatchLog, time: Date.now() });
    state.isProcessing = false;
    document.getElementById('sendBtn').disabled = false;
    renderMessages();
    focusInput();
  }, delay);
}

// ============ Init ============
updateAutoLabel();
updateInputPlaceholder();
focusInput();
</script>
