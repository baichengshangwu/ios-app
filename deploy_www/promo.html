// ========== SPEECH SYNTHESIS ENGINE ==========
let idx=0,playing=false,lang='zh-CN',voices=[];
const synth=window.speechSynthesis;
let currentUtterance=null;

// Load voices
function loadVoices(){
  voices=synth.getVoices();
  if(voices.length===0){setTimeout(loadVoices,200);return;}
  document.getElementById('voiceInd').textContent='🎤 SpeechSynthesis ready';
  setTimeout(()=>document.getElementById('voiceInd').style.opacity='0',2000);
}
synth.onvoiceschanged=loadVoices;
loadVoices();

function getVoice(langCode){
  // Exact match first
  let v=voices.find(v=>v.lang===langCode);
  if(!v) v=voices.find(v=>v.lang.startsWith(langCode.split('-')[0]));
  if(!v) v=voices.find(v=>v.lang.startsWith('en'));
  return v||voices[0];
}

function speakSlide(){
  if(!playing)return;
  synth.cancel();
  const text=(SUB[lang]||SUB['zh-CN'])[idx];
  if(!text){nextSlide();return;}

  currentUtterance=new SpeechSynthesisUtterance(text);
  currentUtterance.lang=lang;
  currentUtterance.rate=0.95;
  currentUtterance.pitch=1;
  currentUtterance.volume=0.9;

  const voice=getVoice(lang);
  if(voice)currentUtterance.voice=voice;

  currentUtterance.onend=()=>{
    if(!playing)return;
    if(idx<SLIDES.length-1){idx++;showSlide();speakSlide();}
    else stop();
  };

  currentUtterance.onerror=(e)=>{
    if(e.error==='canceled'||e.error==='interrupted')return;
    // Fallback: advance after delay if speech fails
    setTimeout(()=>{
      if(!playing)return;
      if(idx<SLIDES.length-1){idx++;showSlide();speakSlide();}
      else stop();
    },3000);
  };

  synth.speak(currentUtterance);
  updateProgAnimate();
}

function updateProgAnimate(){
  const bar=document.getElementById('prog');
  const start=Date.now();
  const estDuration=(SUB[lang]||SUB['zh-CN'])[idx]?.length*80||3000;
  function tick(){
    if(!playing){bar.style.width='0%';return;}
    const pct=Math.min((Date.now()-start)/estDuration*100,99);
    bar.style.width=pct+'%';
    if(pct<99&&playing)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function nextSlide(){idx++;showSlide();}

function init(){
  const ct=document.getElementById('slidesCt');
  SLIDES.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='slide'+(i===0?' active':'');
    d.id='sl'+i;
    d.style.background=s.bg;
    let h='';
    if(s.t)h+=`<div class="title">${s.t['zh-CN']||''}</div>`;
    if(s.d)h+=`<div class="desc">${s.d['zh-CN']||''}</div>`;
    if(s.icons)h+=`<div class="icon-row">${s.icons.map(ic=>`<span>${ic}</span>`).join('')}</div>`;
    if(s.stats)h+=`<div class="stats-row">${s.stats.map(st=>`<div class="stat"><div class="num">${st.n}</div><div class="label">${st.l['zh-CN']}</div></div>`).join('')}</div>`;
    if(s.spec)h+=`<div class="spec-card"><h3>${s.spec.h['zh-CN']||''}</h3><div class="specs">${s.spec.items.map(it=>`<span>${it}</span>`).join('')}</div></div>`;
    if(s.cta)h+=`<a href="https://zhitongwang.cn" target="_blank" style="text-decoration:none"><div class="cta">${s.cta['zh-CN']}</div></a>`;
    d.innerHTML=h;
    ct.appendChild(d);
  });
  updateUI();
}

function showSlide(){
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===idx));
  updateUI();
}

function updateUI(){
  document.getElementById('subBar').textContent=(SUB[lang]||SUB['zh-CN'])[idx]||'';
  document.getElementById('idxInd').textContent=(idx+1)+' / '+SLIDES.length;
}

function switchLang(){
  synth.cancel();
  lang=document.getElementById('langSel').value;
  document.querySelectorAll('.slide').forEach((el,i)=>{
    const s=SLIDES[i];
    if(!s)return;
    const t=el.querySelector('.title'),d=el.querySelector('.desc'),c=el.querySelector('.cta'),sh=el.querySelector('.spec-card h3');
    if(t&&s.t)t.textContent=s.t[lang]||s.t['zh-CN']||'';
    if(d&&s.d)d.textContent=s.d[lang]||s.d['zh-CN']||'';
    if(c&&s.cta)c.textContent=s.cta[lang]||s.cta['zh-CN']||'';
    if(sh&&s.spec)sh.textContent=s.spec.h[lang]||s.spec.h['zh-CN']||'';
    const lbs=el.querySelectorAll('.stat .label');
    if(lbs.length&&s.stats)lbs.forEach((lb,j)=>{if(s.stats[j])lb.textContent=s.stats[j].l[lang]||s.stats[j].l['zh-CN'];});
  });
  updateUI();
  if(playing){synth.cancel();speakSlide();}
}

function togglePlay(){
  playing=!playing;
  document.getElementById('playBtn').textContent=playing?'⏸ 暂停':'▶ 播放';
  document.getElementById('playBtn').classList.toggle('on',playing);
  document.getElementById('prog').style.width='0%';
  if(playing)speakSlide();
  else synth.cancel();
}

function stop(){
  playing=false;
  synth.cancel();
  document.getElementById('playBtn').textContent='🔄 重播';
  document.getElementById('playBtn').classList.remove('on');
  document.getElementById('prog').style.width='100%';
}

function restart(){
  synth.cancel();
  idx=0;
  playing=true;
  document.getElementById('playBtn').textContent='⏸ 暂停';
  document.getElementById('playBtn').classList.add('on');
  document.getElementById('prog').style.width='0%';
  showSlide();
  speakSlide();
}

function skip(dir){
  const ni=idx+dir;
  if(ni<0||ni>=SLIDES.length)return;
  idx=ni;
  showSlide();
  if(playing){synth.cancel();speakSlide();}
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){e.preventDefault();skip(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();skip(-1);}
  if(e.key===' '){e.preventDefault();togglePlay();}
});

init();
</script>
