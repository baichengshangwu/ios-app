audio{display:none}

function init(){

    d.id='slide-'+i;

    const ti=slideTitles[i]||{};
    let html='';

    if(ti.descs) html+=`<div class="desc">${ti.descs['zh-CN']}</div>`;
    if(s.icons) html+=`<div class="cascade-icons">${s.icons.map(ic=>`<span>${ic}</span>`).join('')}</div>`;
    if(s.img) html+=`<img src="${s.img}" alt="" onerror="this.parentElement.querySelector('.title').textContent+=' [图片加载中]'">`;
    if(s.stats) html+=`<div class="stats-overlay">${s.stats.map(st=>`<div class="stat-box"><div class="num">${st.n}</div><div class="label">${st.l['zh-CN']}</div></div>`).join('')}</div>`;
    if(s.cta) html+=`<a href="https://zhitongwang.cn" target="_blank" style="text-decoration:none"><div class="cta">${s.cta['zh-CN']}</div></a>`;
    d.innerHTML=html;
    c.appendChild(d);
  });
  updateUI();
  loadAudio();
  startAuto();
}

function loadAudio(){
  const a=document.getElementById('audioPlayer');

  a.load();
}

function startAuto(){
  if(!playing)return;
  if(timer)clearTimeout(timer);
  const dur=slides[idx].t*1000;
  animateProgress(dur);
  const a=document.getElementById('audioPlayer');
  if(a.paused) a.play().catch(()=>{});
  timer=setTimeout(()=>{
    if(idx<slides.length-1){idx++;showSlide();}else{stop();}
  },dur);
}

function animateProgress(dur){
  const bar=document.getElementById('progressFill'), start=Date.now();
  function tick(){
    const pct=Math.min((Date.now()-start)/dur*100,100);
    bar.style.width=pct+'%';
    if(pct<100&&playing)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function showSlide(){
  document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('active',i===idx));
  updateUI();
  if(playing) startAuto();
}

function updateUI(){
  document.getElementById('subtitleBar').textContent=(subs[lang]||subs['zh-CN'])[idx]||'';
  document.getElementById('slideIndicator').textContent=(idx+1)+' / '+slides.length;
  elapsed=slides.slice(0,idx).reduce((s,sl)=>s+sl.t,0);
  const total=slides.reduce((s,sl)=>s+sl.t,0);
  const m1=Math.floor(elapsed/60),s1=Math.floor(elapsed%60);
  const m2=Math.floor(total/60),s2=Math.floor(total%60);
  document.getElementById('timerDisplay').textContent=
    String(m1).padStart(2,'0')+':'+String(s1).padStart(2,'0')+' / '+String(m2).padStart(2,'0')+':'+String(s2).padStart(2,'0');
}

    if(t&&s.titles) t.textContent=s.titles[displayLang]||s.titles['zh-CN']||'';
    if(d&&s.descs) d.textContent=s.descs[displayLang]||s.descs['zh-CN']||'';
    if(c&&slides[i].cta) c.textContent=slides[i].cta[displayLang]||slides[i].cta['zh-CN'];
    const st=el.querySelectorAll('.stat-box .label');
    if(st.length&&slides[i].stats){
      st.forEach((lb,j)=>{if(slides[i].stats[j])lb.textContent=slides[i].stats[j].l[displayLang]||slides[i].stats[j].l['zh-CN'];});
    }
  });
  loadAudio();
  updateUI();
}

function nextSlide(){if(idx<slides.length-1){idx++;showSlide();}}
function prevSlide(){if(idx>0){idx--;showSlide();}}
function togglePlay(){
  playing=!playing;
  document.getElementById('playBtn').textContent=playing?'⏸ 暂停':'▶ 播放';
  const a=document.getElementById('audioPlayer');
  playing?a.play().catch(()=>{}):a.pause();
  playing?startAuto():clearTimeout(timer);
}
function stop(){
  playing=false;
  document.getElementById('playBtn').textContent='🔄 重播';
  clearTimeout(timer);
  document.getElementById('progressFill').style.width='100%';
  document.getElementById('audioPlayer').pause();
}
function restart(){idx=0;playing=true;document.getElementById('playBtn').textContent='⏸ 暂停';elapsed=0;showSlide();loadAudio();}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();nextSlide();}
  if(e.key==='ArrowLeft'){e.preventDefault();prevSlide();}
  if(e.key==='p')togglePlay();
});
init();
</script>
</body>
</html>
