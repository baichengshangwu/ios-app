let idx=0,playing=false,lang='zh-CN',audioDur=0,slideWin=[];
const a=document.getElementById('audio');

// Compute slide percentage windows from zh-CN subtitle char counts
(function buildWindows(){
  const zh=SUB['zh-CN'];
  let total=0;
  const w=zh.map(s=>{const c=s.length;total+=c;return c});
  let cum=0;
  slideWin=w.map(c=>{const s=cum;cum+=c/total*100;return[s,cum]});
})();

function init(){
  const ct=document.getElementById('slidesCt');
  SLIDES.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='slide'+(i===0?' active':'');
    d.id='sl'+i;
    d.style.background=s.bg;
    let h='';
    if(s.t)h+=`<div class="title">${s.t['zh-CN']||''}</div>`;
    if(s.d)h+=`<div class="desc">${s.d['zh-CN']||''}</div>`;
    if(s.icons)h+=`<div class="icon-row">${s.icons.map(ic=>`<span>${ic}</span>`).join('')}</div>`;
    if(s.stats)h+=`<div class="stats-row">${s.stats.map(st=>`<div class="stat"><div class="num">${st.n}</div><div class="label">${st.l['zh-CN']}</div></div>`).join('')}</div>`;
    if(s.cta)h+=`<a href="https://zhitongwang.cn" target="_blank" style="text-decoration:none"><div class="cta">${s.cta['zh-CN']}</div></a>`;
    d.innerHTML=h;
    ct.appendChild(d);
  });
  loadAudio();
  updateUI();
}

function loadAudio(){
  a.src='promo_audio_'+lang+'.mp3';
  a.load();
  a.onloadedmetadata=()=>{audioDur=a.duration;updateTimer();};
}

function slideForTime(t){
  if(!audioDur)return idx;
  const pct=t/audioDur*100;
  for(let i=0;i<slideWin.length;i++)if(pct>=slideWin[i][0]&&pct<slideWin[i][1])return i;
  return slideWin.length-1;
}

a.ontimeupdate=function(){
  if(!playing)return;
  const ni=slideForTime(a.currentTime);
  if(ni!==idx){idx=ni;showSlide();}
  updateTimer();
  document.getElementById('prog').style.width=(a.currentTime/audioDur*100)+'%';
};

a.onended=function(){stop();};

function showSlide(){
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===idx));
  updateUI();
}

function updateUI(){
  document.getElementById('subBar').textContent=(SUB[lang]||SUB['zh-CN'])[idx]||'';
  document.getElementById('idxInd').textContent=(idx+1)+' / '+SLIDES.length;
  updateTimer();
}

function updateTimer(){
  const cur=playing?a.currentTime:0;
  const m1=Math.floor(cur/60),s1=Math.floor(cur%60);
  const m2=Math.floor(audioDur/60),s2=Math.floor(audioDur%60);
  document.getElementById('timer').textContent=
    String(m1).padStart(2,'0')+':'+String(s1).padStart(2,'0')+' / '+String(m2).padStart(2,'0')+':'+String(s2).padStart(2,'0');
}

function switchLang(){
  lang=document.getElementById('langSel').value;
  document.querySelectorAll('.slide').forEach((el,i)=>{
    const s=SLIDES[i];if(!s)return;
    const t=el.querySelector('.title'),d=el.querySelector('.desc'),c=el.querySelector('.cta');
    if(t&&s.t)t.textContent=s.t[lang]||s.t['zh-CN']||'';
    if(d&&s.d)d.textContent=s.d[lang]||s.d['zh-CN']||'';
    if(c&&s.cta)c.textContent=s.cta[lang]||s.cta['zh-CN']||'';
    const lbs=el.querySelectorAll('.stat .label');
    if(lbs.length&&s.stats)lbs.forEach((lb,j)=>{if(s.stats[j])lb.textContent=s.stats[j].l[lang]||s.stats[j].l['zh-CN'];});
  });
  loadAudio();
  updateUI();
}

function togglePlay(){
  playing=!playing;
  document.getElementById('playBtn').textContent=playing?'⏸ 暂停':'▶ 播放';
  document.getElementById('playBtn').classList.toggle('on',playing);
  if(playing){
    a.play().catch(()=>{});
  }else{
    a.pause();
  }
}

function stop(){
  playing=false;
  document.getElementById('playBtn').textContent='🔄 重播';
  document.getElementById('playBtn').classList.remove('on');
  document.getElementById('prog').style.width='100%';
  a.pause();
}

function restart(){
  a.currentTime=0;
  idx=0;
  playing=true;
  document.getElementById('playBtn').textContent='⏸ 暂停';
  document.getElementById('playBtn').classList.add('on');
  showSlide();
  a.play().catch(()=>{});
}

function skip(dir){
  const ni=idx+dir;
  if(ni<0||ni>=SLIDES.length)return;
  idx=ni;
  if(playing&&audioDur){
    const mid=(slideWin[idx][0]+slideWin[idx][1])/2;
    a.currentTime=mid/100*audioDur;
  }
  showSlide();
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){e.preventDefault();skip(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();skip(-1);}
  if(e.key===' '){e.preventDefault();togglePlay();}
});

init();
</script>
</body>
</html>
