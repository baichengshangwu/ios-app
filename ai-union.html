<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-key="page_title">AI联盟办公室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg: #0a0e17;
  --card: #111827;
  --border: #1e293b;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --accent: #6366f1;
  --accent2: #8b5cf6;
  --success: #10b981;
  --warn: #f59e0b;
  --danger: #ef4444;
  --scarf-red: #ef4444;
  --scarf-blue: #3b82f6;
  --scarf-pink: #ec4899;
  --scarf-white: #f1f5f9;
  --scarf-yellow: #facc15;
  --scarf-green: #22c55e;
}
body{
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
header{
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
header h1{
  font-size: 17px;
  font-weight: 600;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: flex;
  align-items: center;
  gap: 8px;
}
header h1 .title-panda{
  font-size: 22px;
  -webkit-text-fill-color: initial;
}
.header-right{
  display: flex;
  align-items: center;
  gap: 16px;
}
.lang-switch{
  position: relative;
}
.lang-switch select{
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 4px 8px;
  font-size: 12px;
  outline: none;
  cursor: pointer;
}

.layout{
  display: flex;
  flex: 1;
  overflow: hidden;
}
.sidebar{
  width: 260px;
  background: var(--card);
  border-right: 1px solid var(--border);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
}
.sidebar h3{
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.agent-card{
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.agent-card:hover{
  border-color: var(--accent);
  transform: translateX(2px);
}
.agent-card.active{
  border-color: var(--accent2);
  background: rgba(99,102,241,0.08);
}
.agent-card .icon{
  font-size: 36px;
  margin-bottom: 4px;
}
.agent-card .name{
  font-size: 13px;
  font-weight: 600;
}
.agent-card .role{
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}
.agent-card .scarf{
  display: inline-block;
  font-size: 10px;
  padding: 2px 10px;
  border-radius: 10px;
  margin-top: 6px;
  font-weight: 600;
}
.scarf.mengzhu{background:rgba(239,68,68,0.15);color:var(--scarf-red)}
.scarf.mengge{background:rgba(59,130,246,0.15);color:var(--scarf-blue)}
.scarf.mengjie{background:rgba(236,72,153,0.15);color:var(--scarf-pink)}
.scarf.mengdi{background:rgba(241,245,249,0.15);color:var(--scarf-white)}
.scarf.mengmei{background:rgba(250,204,21,0.15);color:var(--scarf-yellow)}
.scarf.mengmeng{background:rgba(34,197,94,0.15);color:var(--scarf-green)}

.main{
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.chat-area{
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.welcome-msg{
  text-align: center;
  margin: auto;
  max-width: 500px;
}
.welcome-msg h2{
  font-size: 28px;
  margin-bottom: 12px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.welcome-msg p{
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}
.team-grid{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 20px;
}
.team-grid .mini-agent{
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.team-grid .mini-agent:hover{
  border-color: var(--accent);
}
.team-grid .mini-agent .mi{
  font-size: 28px;
  margin-bottom: 4px;
}
.team-grid .mini-agent .mn{
  font-size: 11px;
  font-weight: 600;
}
.team-grid .mini-agent .mr{
  font-size: 10px;
  color: var(--muted);
}

.msg{
  display: flex;
  gap: 12px;
  max-width: 80%;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.msg.user{ align-self: flex-end; flex-direction: row-reverse; }
.msg.agent{ align-self: flex-start; }
.msg .avatar{
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.msg.user .avatar{ background: var(--accent); }
.msg.agent .avatar{ background: var(--border); }
.msg .bubble{
  padding: 12px 16px;
  border-radius: 14px;
  line-height: 1.5;
  font-size: 14px;
}
.msg.user .bubble{
  background: var(--user-bubble,#1e3a5f);
  border-bottom-right-radius: 4px;
}
.msg.agent .bubble{
  background: var(--agent-bubble,#1a1f2e);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.msg .sender{
  font-size: 11px;
  color: var(--accent);
  margin-bottom: 4px;
  font-weight: 600;
}

.typing-indicator{
  display: flex;
  gap: 4px;
  padding: 8px 0;
}
.typing-indicator span{
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: bounce 1.4s infinite;
}
.typing-indicator span:nth-child(2){ animation-delay: 0.2s; }
.typing-indicator span:nth-child(3){ animation-delay: 0.4s; }
@keyframes bounce{ 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

.input-bar{
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  gap: 10px;
}
.input-bar input{
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 16px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border 0.2s;
}
.input-bar input:focus{ border-color: var(--accent); }
.input-bar input::placeholder{ color: var(--muted); }
.input-bar button{
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white; border: none;
  border-radius: 10px;
  padding: 10px 20px;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
.input-bar button:hover{ opacity: 0.9; }
.input-bar button:disabled{ opacity: 0.5; cursor: not-allowed; }

@media (max-width: 768px){
  .sidebar{ display: none; }
  .msg{ max-width: 95%; }
}
</style>
</head>
<body>

<header>
  <h1><span class="title-panda">🐼</span><span data-key="header_title">AI联盟办公室</span></h1>
  <div class="header-right">
    <div class="lang-switch">
      <select id="langSelect" onchange="setLang(this.value)">
        <option value="zh-CN">🇨🇳 简体中文</option>
        <option value="zh-TW">🇹🇼 繁體中文</option>
        <option value="en">🇺🇸 English</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="es">🇪🇸 Español</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="pt">🇵🇹 Português</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="hi">🇮🇳 हिन्दी</option>
        <option value="th">🇹🇭 ไทย</option>
        <option value="vi">🇻🇳 Tiếng Việt</option>
        <option value="id">🇮🇩 Bahasa Indonesia</option>
        <option value="it">🇮🇹 Italiano</option>
      </select>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <h3 data-key="sidebar_title">团队成员</h3>

    <div class="agent-card active" onclick="selectAgent('mengzhu')" id="card-mengzhu">
      <div class="icon">🐼</div>
      <div class="name" data-key="mz_name">盟主</div>
      <div class="role" data-key="mz_role">任务调度 · 协调分发</div>
      <span class="scarf mengzhu" data-key="mz_scarf">🔴 红围脖</span>
    </div>

    <div class="agent-card" onclick="selectAgent('mengge')" id="card-mengge">
      <div class="icon">🐼</div>
      <div class="name" data-key="mg_name">萌哥</div>
      <div class="role" data-key="mg_role">文件管理 · 数据处理</div>
      <span class="scarf mengge" data-key="mg_scarf">🔵 蓝围脖</span>
    </div>

    <div class="agent-card" onclick="selectAgent('mengjie')" id="card-mengjie">
      <div class="icon">🐼</div>
      <div class="name" data-key="mj_name">萌姐</div>
      <div class="role" data-key="mj_role">信息检索 · 资料调研</div>
      <span class="scarf mengjie" data-key="mj_scarf">💗 粉围脖</span>
    </div>

    <div class="agent-card" onclick="selectAgent('mengdi')" id="card-mengdi">
      <div class="icon">🐼</div>
      <div class="name" data-key="md_name">萌弟</div>
      <div class="role" data-key="md_role">代码分析 · 开发辅助</div>
      <span class="scarf mengdi" data-key="md_scarf">🤍 白围脖</span>
    </div>

    <div class="agent-card" onclick="selectAgent('mengmei')" id="card-mengmei">
      <div class="icon">🐼</div>
      <div class="name" data-key="mm_name">萌妹</div>
      <div class="role" data-key="mm_role">文案撰写 · 内容创作</div>
      <span class="scarf mengmei" data-key="mm_scarf">💛 黄围脖</span>
    </div>

    <div class="agent-card" onclick="selectAgent('mengmeng')" id="card-mengmeng">
      <div class="icon">🐼</div>
      <div class="name" data-key="mm2_name">萌萌</div>
      <div class="role" data-key="mm2_role">全能辅助 · 综合支持</div>
      <span class="scarf mengmeng" data-key="mm2_scarf">💚 绿围脖</span>
    </div>
  </aside>

  <div class="main">
    <div class="chat-area" id="chatArea">
      <div class="welcome-msg">
        <h2 data-key="welcome_h2">AI联盟办公室</h2>
        <p data-key="welcome_p">专为一人公司打造的办公团队，由盟主统一调度，各队员分工协作，高效完成你的每一项任务。</p>
        <div class="team-grid">
          <div class="mini-agent" onclick="selectAgent('mengzhu')"><div class="mi">🐼</div><div class="mn" data-key="mz_name">盟主</div><div class="mr" data-key="mz_role_short">队长</div></div>
          <div class="mini-agent" onclick="selectAgent('mengge')"><div class="mi">🐼</div><div class="mn" data-key="mg_name">萌哥</div><div class="mr" data-key="mg_role_short">文件</div></div>
          <div class="mini-agent" onclick="selectAgent('mengjie')"><div class="mi">🐼</div><div class="mn" data-key="mj_name">萌姐</div><div class="mr" data-key="mj_role_short">搜索</div></div>
          <div class="mini-agent" onclick="selectAgent('mengdi')"><div class="mi">🐼</div><div class="mn" data-key="md_name">萌弟</div><div class="mr" data-key="md_role_short">开发</div></div>
          <div class="mini-agent" onclick="selectAgent('mengmei')"><div class="mi">🐼</div><div class="mn" data-key="mm_name">萌妹</div><div class="mr" data-key="mm_role_short">创作</div></div>
          <div class="mini-agent" onclick="selectAgent('mengmeng')"><div class="mi">🐼</div><div class="mn" data-key="mm2_name">萌萌</div><div class="mr" data-key="mm2_role_short">全能</div></div>
        </div>
      </div>
    </div>
    <div class="input-bar">
      <input type="text" id="msgInput" data-key-placeholder="input_placeholder" placeholder="输入任务，盟主将自动分发给最合适的队员..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()" id="sendBtn" data-key="send">发送</button>
    </div>
  </div>
</div>

<script>
// ============ i18n ============
const LANG_DATA = JSON.parse(document.getElementById('lang-data-json').textContent);

let curLang = 'zh-CN';
function getLang() { return curLang; }

function L(key) {
  const d = LANG_DATA[curLang];
  if (!d) return key;
  if (d[key] !== undefined) return d[key];
  if (LANG_DATA['zh-CN'] && LANG_DATA['zh-CN'][key] !== undefined) return LANG_DATA['zh-CN'][key];
  return key;
}

function applyI18N() {
  document.querySelectorAll('[data-key]').forEach(el => {
    const k = el.getAttribute('data-key');
    const v = L(k);
    if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll('[data-key-placeholder]').forEach(el => {
    const k = el.getAttribute('data-key-placeholder');
    const v = L(k);
    if (v) el.placeholder = v;
  });
  document.title = L('page_title');
}

function setLang(lang) {
  if (!LANG_DATA[lang]) return;
  curLang = lang;
  document.getElementById('langSelect').value = lang;
  applyI18N();
  renderMessages();
}

// ============ Agent definitions ============
const AGENT_INFO = {
  mengzhu: { icon: '🐼', prefix: 'mz_', color: '#ef4444', key: 'mengzhu' },
  mengge:  { icon: '🐼', prefix: 'mg_', color: '#3b82f6', key: 'mengge' },
  mengjie: { icon: '🐼', prefix: 'mj_', color: '#ec4899', key: 'mengjie' },
  mengdi:  { icon: '🐼', prefix: 'md_', color: '#f1f5f9', key: 'mengdi' },
  mengmei: { icon: '🐼', prefix: 'mm_', color: '#facc15', key: 'mengmei' },
  mengmeng:{ icon: '🐼', prefix: 'mm2_', color: '#22c55e', key: 'mengmeng' }
};

function getAgentName(id) { return L(AGENT_INFO[id].prefix + 'name') || id; }

// ============ State ============
let state = {
  activeAgent: 'mengzhu',
  messages: [],
  isProcessing: false
};

// ============ UI ============
function selectAgent(id) {
  state.activeAgent = id;
  document.querySelectorAll('.agent-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card-' + id);
  if (card) card.classList.add('active');
}

function focusInput() { document.getElementById('msgInput').focus(); }

// ============ Render ============
function renderMessages() {
  const chat = document.getElementById('chatArea');
  chat.innerHTML = '';
  if (state.messages.length === 0) {
    chat.innerHTML = 
      '<div class="welcome-msg">' +
      '<h2 data-key="welcome_h2">' + L('welcome_h2') + '</h2>' +
      '<p data-key="welcome_p">' + L('welcome_p') + '</p>' +
      '<div class="team-grid">' +
      '<div class="mini-agent" onclick="selectAgent(\'mengzhu\')"><div class="mi">🐼</div><div class="mn">' + L('mz_name') + '</div><div class="mr">' + L('mz_role_short') + '</div></div>' +
      '<div class="mini-agent" onclick="selectAgent(\'mengge\')"><div class="mi">🐼</div><div class="mn">' + L('mg_name') + '</div><div class="mr">' + L('mg_role_short') + '</div></div>' +
      '<div class="mini-agent" onclick="selectAgent(\'mengjie\')"><div class="mi">🐼</div><div class="mn">' + L('mj_name') + '</div><div class="mr">' + L('mj_role_short') + '</div></div>' +
      '<div class="mini-agent" onclick="selectAgent(\'mengdi\')"><div class="mi">🐼</div><div class="mn">' + L('md_name') + '</div><div class="mr">' + L('md_role_short') + '</div></div>' +
      '<div class="mini-agent" onclick="selectAgent(\'mengmei\')"><div class="mi">🐼</div><div class="mn">' + L('mm_name') + '</div><div class="mr">' + L('mm_role_short') + '</div></div>' +
      '<div class="mini-agent" onclick="selectAgent(\'mengmeng\')"><div class="mi">🐼</div><div class="mn">' + L('mm2_name') + '</div><div class="mr">' + L('mm2_role_short') + '</div></div>' +
      '</div></div>';
    return;
  }
  state.messages.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.role === 'user' ? 'user' : 'agent');
    const info = AGENT_INFO[m.agentId] || AGENT_INFO.mengzhu;
    if (m.role === 'user') {
      div.innerHTML = '<div class="avatar">👤</div><div class="bubble">' + m.text.replace(/\n/g, '<br>') + '</div>';
    } else {
      let textHtml = m.text.replace(/\n/g, '<br>');
      div.innerHTML = '<div class="avatar">' + info.icon + '</div><div class="bubble"><div class="sender">' + getAgentName(m.agentId) + '</div>' + textHtml + '</div>';
    }
    chat.appendChild(div);
  });
  chat.scrollTop = chat.scrollHeight;
}

function addTyping(agentId) {
  const chat = document.getElementById('chatArea');
  const welcome = chat.querySelector('.welcome-msg');
  if (welcome) welcome.remove();
  const div = document.createElement('div');
  div.className = 'msg agent';
  div.id = 'typing-' + agentId;
  div.innerHTML = '<div class="avatar">🐼</div><div class="bubble"><div class="sender">' + getAgentName(agentId) + '</div><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping(agentId) {
  const el = document.getElementById('typing-' + agentId);
  if (el) el.remove();
}

// ============ Dispatch ============
function dispatchTask(userMsg) {
  const lower = userMsg.toLowerCase();
  const keywords = {
    mengge:  ['文件','文件夹','路径','读取','写入','保存','删除','重命名','下载','上传','压缩','解压','file','folder','path','read','write','save','delete','rename','download','zip','csv','json','xml'],
    mengjie: ['搜索','查找','查询','调研','对比','最新','新闻','资料','论文','报告','排行','search','find','query','research','latest','news','compare','paper','report','price'],
    mengdi:  ['代码','编程','函数','bug','错误','调试','算法','接口','api','前端','后端','数据库','code','function','debug','error','algorithm','sql','python','js','html','css','git'],
    mengmei: ['写','翻译','文案','文章','文档','报告','邮件','润色','总结','摘要','介绍','write','translate','article','email','document','summary','polish','essay'],
    mengmeng:['帮助','帮忙','支持','协助','综合','help','support','assist']
  };

  let scores = { mengge: 0, mengjie: 0, mengdi: 0, mengmei: 0, mengmeng: 0 };
  Object.entries(keywords).forEach(([agent, words]) => {
    words.forEach(w => { if (lower.includes(w.toLowerCase())) scores[agent] += 1; });
  });

  let best = 'mengzhu', bestScore = 0, ties = [];
  Object.entries(scores).forEach(([agent, score]) => {
    if (score > bestScore) { bestScore = score; best = agent; ties = [agent]; }
    else if (score === bestScore && score > 0) ties.push(agent);
  });
  if (bestScore === 0) best = 'mengzhu';
  else if (ties.length > 1) best = 'mengzhu';
  return best;
}

// ============ Generate Response ============
function generateResponse(agentId, userMsg) {
  const responses = {
    mengzhu: L('rsp_mz'),
    mengge: L('rsp_mg'),
    mengjie: L('rsp_mj'),
    mengdi: L('rsp_md'),
    mengmei: L('rsp_mm'),
    mengmeng: L('rsp_mm2')
  };
  return (responses[agentId] || responses.mengzhu) + '\n\n' + L('rsp_task') + '「' + userMsg + '」';
}

// ============ Send Message ============
function sendMsg() {
  if (state.isProcessing) return;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  const welcome = document.getElementById('chatArea').querySelector('.welcome-msg');
  if (welcome) welcome.remove();

  state.messages.push({ role: 'user', agentId: 'mengzhu', text: text, time: Date.now() });

  const targetAgent = dispatchTask(text);
  state.isProcessing = true;
  document.getElementById('sendBtn').disabled = true;
  addTyping(targetAgent);

  const delay = 800 + Math.random() * 1200;
  setTimeout(() => {
    removeTyping(targetAgent);
    const response = generateResponse(targetAgent, text);
    state.messages.push({ role: 'agent', agentId: targetAgent, text: response, time: Date.now() });
    state.isProcessing = false;
